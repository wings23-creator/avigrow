  // ===== תצוגה מקדימה לתמונה שנבחרה =====
  const photoInput = document.getElementById('photo-input');
  const photoPreview = document.getElementById('photo-preview');
  const photoLabel = document.getElementById('photo-label');
  let selectedPhotoDataUrl = null;

  // ===== הקטנת תמונה לפני שמירה =====
  // תמונות ישירות ממצלמת נייד יכולות להיות כמה MB - זה ממלא מהר את עמודת ה-photo בטבלה.
  // מצמצמים לרוחב מקסימלי סביר ואיכות JPEG טובה, בלי שינוי נראה לעין.
  function compressImage(dataUrl, maxWidth = 900, quality = 0.72) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(dataUrl); // אם ההקטנה נכשלת, נמשיך עם המקור
      img.src = dataUrl;
    });
  }

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      selectedPhotoDataUrl = await compressImage(e.target.result);
      photoPreview.src = selectedPhotoDataUrl;
      photoPreview.style.display = 'block';
      photoLabel.textContent = t('photo_change');
      identifyPlant(selectedPhotoDataUrl); // מזהים את הצמח אוטומטית ברגע שיש תמונה
    };
    reader.readAsDataURL(file);
  });

  // ===== זיהוי הצמח מהתמונה באמצעות Claude =====
  // שולחים את התמונה ל-API ומבקשים JSON מובנה עם השם בעברית, באנגלית והערת טיפול קצרה
  const identifyStatus = document.getElementById('identify-status');
  const submitBtn = document.querySelector('#plant-form button[type="submit"]');

  async function identifyPlant(dataUrl) {
    const match = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/);
    if (!match) return;
    const mediaType = match[1];
    const base64Data = match[2];

    identifyStatus.textContent = t('identifying');
    identifyStatus.classList.remove('error');
    submitBtn.disabled = true;

    try {
      const data = await callPlantAI(
        "אתה מזהה צמחי בית מתמונות. תשיב אך ורק באובייקט JSON תקני, בלי טקסט נוסף ובלי גדרות markdown, בפורמט הבא: {\"nameHe\": \"שם עממי בעברית\", \"nameEn\": \"English common name\", \"notes\": \"טיפ טיפול קצר במשפט אחד בעברית - תדירות השקיה או צרכי אור\"}. אם אינך בטוח בזיהוי, תן את הניחוש הטוב ביותר וציין את אי הוודאות בקצרה בשדה notes.",
        mediaType,
        base64Data,
        "זהה את הצמח בתמונה הזו. השדה nameHe והשדה notes צריכים להיות בשפה: " + LANG_NAMES[currentLang]
      );
      if (data.error) throw new Error(data.error.message || 'שגיאת שרת בזיהוי');

      const textBlock = (data.content || []).find(b => b.type === "text");
      if (!textBlock) throw new Error("לא התקבלה תשובת טקסט מהזיהוי");

      // שולפים רק את בלוק ה-JSON מתוך הטקסט, גם אם יש סביבו מילים נוספות
      const jsonMatch = textBlock.text.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error("תשובת הזיהוי לא הייתה בפורמט תקין");
      const parsed = JSON.parse(jsonMatch[0]);

      document.getElementById('name-he').value = parsed.nameHe || '';
      document.getElementById('name-en').value = parsed.nameEn || '';
      document.getElementById('notes').value = parsed.notes || '';
      identifyStatus.textContent = t('identified');
    } catch (err) {
      console.error('Plant identification failed:', (err && err.message) || String(err));
      identifyStatus.textContent = t('identify_failed');
      identifyStatus.classList.add('error');
    } finally {
      submitBtn.disabled = false;
    }
  }

  // ===== שליחת הטופס =====
  const form = document.getElementById('plant-form');
  const saveError = document.getElementById('save-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveError.style.display = 'none';

    try {
      const nameHe = document.getElementById('name-he').value.trim();
      const nameEn = document.getElementById('name-en').value.trim();
      const notes = document.getElementById('notes').value.trim();

      if (!nameHe) return; // שם בעברית הוא שדה חובה

      submitBtn.disabled = true;

      try {
        await insertPlant({ nameHe, nameEn, notes, photo: selectedPhotoDataUrl });
      } catch (err) {
        console.error('Save failed:', (err && err.message) || String(err));
        saveError.textContent = t('save_failed');
        saveError.style.display = 'block';
        return; // לא מאפסים את הטופס - כדי שלא תאבדי את מה שהקלדת
      } finally {
        submitBtn.disabled = false;
      }

      // איפוס הטופס לצמח הבא
      form.reset();
      selectedPhotoDataUrl = null;
      photoPreview.style.display = 'none';
      photoLabel.textContent = t('photo_pick');

      await renderPlants();
    } catch (err) {
      // רשת ביטחון: כל שגיאה לא צפויה אחרת תוצג כאן במקום לקרוס בשקט
      console.error('Unexpected error while saving plant:', (err && err.message) || String(err));
      saveError.textContent = t('unexpected') + (err && err.message ? err.message : String(err));
      saveError.style.display = 'block';
    }
  });

  // ===== הצגת רשימת הצמחים =====
  // מעדכן את כרטיס "להשקות היום" בדף הבית - מוצג רק אם יש בפועל צמח שצריך השקיה
  function updateHomeWateringFocus(allPlants) {
    const card = document.getElementById('watering-focus-card');
    const due = allPlants.filter(isDueForWatering);
    if (due.length === 0) {
      card.style.display = 'none';
      return;
    }
    document.getElementById('watering-focus-count').textContent = due.length;
    document.getElementById('watering-focus-list').innerHTML = due.map(p => {
      const w = computeWateringStatus(p);
      return `<div class="focus-row"><span>${p.nameHe}</span><span>${w.text.replace(/^[💧⚠️]+\s*/, '')}</span></div>`;
    }).join('');
    card.style.display = 'block';
  }

  // =====================================================================
  //  תנאי גידול
  //  לכל צמח כפתור שפותח חלון עם ארבעה חלקים: תאורה, עונתיות, מצע,
  //  והשקיה + תדירות. המידע לא נשמר בבסיס הנתונים אלא נגזר מהמין:
  //  CARE_DB מתאים את השם הלטיני/העברי לערך, וכל ערך מצביע על קודים
  //  (light / season / soil / water) שמתורגמים פעם אחת לשלוש השפות.
  //  כך המידע נשאר מדויק למין הספציפי בלי לשכפל טקסט לכל צמח.
  // =====================================================================

  // מכפילי עונה על מרווח ההשקיה של הקיץ. הקיץ הוא הבסיס (1) כי אז
  // הצמח צורך הכי הרבה מים; בחורף הקצב יורד כמעט לחצי.
  const SEASON_MULT = { summer: 1, autumn: 1.35, winter: 1.9, spring: 1.1 };
  // צמחי חורף (ליתופס, פקעות חורף) - לוח הפוך: בקיץ לא משקים בכלל.
  const SEASON_MULT_WINTER_GROWER = { summer: null, autumn: 1, winter: 1, spring: 1.5 };

  // עונות לפי האקלים בישראל: קיץ ארוך שנמשך עד סוף ספטמבר, חורף קצר.
  function currentSeason() {
    const m = new Date().getMonth() + 1;
    if (m >= 6 && m <= 9) return 'summer';
    if (m === 10 || m === 11) return 'autumn';
    if (m === 12 || m <= 2) return 'winter';
    return 'spring';
  }

  const CARE_I18N = {
    he: {
      season_now: 'העונה עכשיו: {s}',
      s_summer: 'קיץ', s_autumn: 'סתיו', s_winter: 'חורף', s_spring: 'אביב',
      h_light: 'תאורה', h_season: 'עונתיות', h_soil: 'מצע', h_water: 'השקיה ותדירות',
      h_warn: 'שימו לב',
      freq_title: 'מרווח מומלץ בין השקיות, לפי עונה',
      freq_none: 'ללא',
      freq_no_schedule: 'לא לפי לוח זמנים',
      applied_now: 'במערכת מוגדר כרגע כל {n} ימים.',
      applied_none: 'לא הוגדר מרווח השקיה במערכת.',
      apply_btn: 'לעדכן ל-{n} ימים בעונה הנוכחית',
      applying: 'מעדכן...',
      apply_failed: 'העדכון נכשל: ',
      unknown_title: 'אין לנו נתונים מדויקים למין הזה',
      unknown_body: 'הצמח לא נמצא במאגר תנאי הגידול של האפליקציה, ולא ננחש. כדאי לוודא את השם הלטיני (השדה באנגלית) - ברגע שהוא מזוהה, המידע יופיע כאן אוטומטית. עד אז: אור בהיר עקיף, מצע מנקז, והשקיה רק כששכבת 2-3 ס"מ העליונים יבשה למגע.',
      gl_indoor: 'תחת תאורת גידול: 25-35 ס"מ מהנורה, 12-14 שעות ביום.',
      gl_sun: 'תאורת גידול לבדה בדרך כלל לא מספיקה לצמח שמש - הוא זקוק לשמש אמיתית או לנורה חזקה במיוחד וקרובה.',
      gl_shade: 'תחת תאורת גידול: מרחק 40 ס"מ ומעלה, או בשולי קרן האור. נורה חזקה מקרוב תלבין את העלים.',

      l_full_sun: 'שמש מלאה - 6 שעות ומעלה של שמש ישירה ביום. חלון דרומי או מערבי, או מרפסת פתוחה. פחות מזה והצמח יתארך ויאבד צורה וצבע.',
      l_sun_am: 'שמש ישירה בשעות הבוקר בלבד, וצל בשעות החמות. חלון מזרחי הוא המיקום האידיאלי.',
      l_bright_indirect: 'אור בהיר עקיף - ליד חלון אבל מחוץ לקו השמש הישירה, או מאחורי וילון דק. השמש הישירה של הצהריים שורפת את העלים.',
      l_medium: 'אור בינוני - מטר עד שלושה מהחלון, או חלון צפוני. לא יסבול שמש ישירה חזקה.',
      l_low_ok: 'סובל אור נמוך, אבל לא חושך. באור חלש הצמיחה תאט מאוד, העלים יחווירו והגבעולים יתארכו - זה לא סימן מחלה אלא בקשה לאור.',

      sn_summer_grower: 'צמח קיץ - עונת הגדילה שלו היא אביב עד סוף הסתיו. מדשנים רק בעונה הזו, ומפסיקים לגמרי מדצמבר עד פברואר.',
      sn_winter_grower: 'צמח חורף, עם לוח הפוך: מתעורר בספטמבר-אוקטובר כשהחום נשבר, גדל ופורח כל החורף, ונרדם באביב. בשיא הקיץ הוא ישן - השקיה אז מרקיבה אותו.',
      sn_evergreen_indoor: 'צמח פנים ירוק-עד - גדל כמעט כל השנה, עם האטה מורגשת בדצמבר-פברואר. בחודשים האלה מפחיתים מים ומפסיקים דישון.',
      sn_winter_rest: 'מאט מאוד בחורף ועלול להשיל חלק מהעלים - זו תרדמה חלקית ולא מחלה. מפחיתים מים בחדות מדצמבר עד פברואר ומחכים; העלים חוזרים כשהמצע מתחמם.',
      sn_winter_dormant: 'נכנס לתרדמה מלאה: בסוף הסתיו העלים מצהיבים ונושרים - זה נורמלי לגמרי. הפקעת נחה יבשה עד האביב, ובלי מים בכלל. השקיה בתרדמה מרקיבה אותה.',
      sn_terrarium: 'בתוך טרריום העונתיות מתונה - האקלים בפנים כמעט קבוע. עדיין: פחות אור בחורף פירושו צמיחה איטית יותר, ולכן פחות צורך בהתערבות.',

      so_gritty: 'מצע מנקז מאוד: 50-70% מינרלי (פרלייט, פומיס, חול גס או אקדמה) עם מעט קומפוסט. אחרי השקיה המים צריכים לרדת מיד ולא לעמוד.',
      so_aroid: 'מצע אוורירי לצמחי אררואיד: קליפות אורן + פרלייט + סיבי קוקוס, ומעט אדמה. השורשים האוויריים צריכים חמצן וייחנקו באדמת עציץ רגילה.',
      so_moist_rich: 'מצע עשיר שמחזיק לחות אבל לא נקווה: קוקוס או כבול + פרלייט + מעט קומפוסט. הוא צריך להיות לח כמו ספוג סחוט, לא בוצי.',
      so_bark_epiphyte: 'מצע אפיפיטי גס: קליפות אורן, ספגנום ופחם - כמעט בלי אדמה. בטבע הצמח יושב על עץ, לא בקרקע.',
      so_terrarium: 'שכבות טרריום: ניקוז (לקה או חצץ) בתחתית, רשת מפרידה, ומעליהם מצע יער עם ספגנום ופחם פעיל.',
      so_standard: 'אדמת עציץ איכותית עם תוספת 20-30% פרלייט לניקוז. חובה חור ניקוז בעציץ.',

      w_dry_fully: 'להשקות רק כשהמצע יבש לגמרי לעומק - לא רק בשכבה העליונה. אצבע או שיפוד עד אמצע העציץ: יצא נקי ויבש - להשקות. יש ספק - לחכות עוד שבוע.',
      w_dry_two_thirds: 'לתת לשני שלישים העליונים של המצע להתייבש בין השקיות. אז להשקות ברצינות עד שהמים יוצאים מהניקוז.',
      w_dry_top_third: 'להשקות כשהשליש העליון של המצע יבש. השקיה יסודית עד ניקוז, ולרוקן את הצלוחית אחרי עשר דקות.',
      w_dry_top_layer: 'להשקות כששכבת 2-3 הסנטימטרים העליונים יבשה למגע. לא לתת לגוש להתייבש לגמרי.',
      w_evenly_moist: 'לשמור על לחות אחידה וקבועה - לא בוצי ולא יבש. עדיף מעט מים בתדירות גבוהה מאשר הצפה אחת נדירה.',
      w_orchid_soak: 'טבילה: להשרות את העציץ במים 10-15 דקות, ואז לתת לו לנקז לגמרי. לעולם לא להשאיר מים בעציץ הדקורטיבי החיצוני.',
      w_condensation: 'בטרריום סגור לא משקים לפי לוח זמנים. המדד הוא עיבוי על הזכוכית: ערפל קל בבוקר שנעלם במשך היום = מאוזן. אין עיבוי כמה ימים ברצף = לרסס מעט. טיפות זולגות כל היום = לאוורר, לא להוסיף מים.',

      wr_rot: 'עודף מים הוא הסכנה מספר אחת. צמח קמל עם מצע רטוב סובל מריקבון שורשים ולא מצמא - השקיה נוספת רק תזרז את הקריסה.',
      wr_burn: 'שמש ישירה חזקה כווה את העלים: כתמים לבנבנים או חומים ויבשים שלא מתאוששים.',
      wr_fluoride: 'רגיש לפלואוריד ולכלור במי ברז, והתוצאה היא קצוות עלים חומים. עדיף מים מסוננים או מים שעמדו לילה פתוחים.',
      wr_salts: 'מלחי דשן מצטברים במצע ושורפים את קצוות השורשים. פעם בכמה חודשים לשטוף את העציץ בכמות מים גדולה עד שהם יוצאים מהניקוז.',
      wr_no_rosette: 'לא לשפוך מים לתוך מרכז הרוזטה - מים שנשארים שם גורמים לריקבון מהמרכז החוצה.',
      wr_no_wet_leaves: 'לא להרטיב את העלים השעירים - השיער מחזיק מים והעלה נרקב מתחתיו.',
      wr_farina: 'הציפוי הקמחי הבהיר על העלים הוא הגנת שמש טבעית של הצמח. לא לגעת ולא לנגב - הוא לא חוזר.',
      wr_sap: 'המוהל הלבן מגרה עור ועיניים ורעיל בבליעה. כפפות בגיזום, ולשטוף מיד במגע.',
      wr_humidity: 'צריך לחות אוויר גבוהה. אוויר יבש מתבטא בקצוות חומים ומזמין אקריות אדומות.',
      wr_draft: 'רגיש לזרם אוויר קר - לא מול מזגן, מאוורר או חלון פתוח בחורף.',
      wr_leggy: 'מתארך ומתקרח כשחסר לו אור. קטימה מעודדת התעבות, והקצוות שנגזמו משרישים בקלות ואפשר לנעוץ אותם בחזרה באותו עציץ.',
      wr_repot_tight: 'אוהב להיות צפוף בעציץ. החלפת עציץ מוקדמת מדי דוחה את הפריחה בשנה.',
      wr_keep_spurs: 'לא לגזום את עוקצי הפריחה הישנים - הפריחה הבאה חוזרת בדיוק מהם.',
      wr_distilled: 'רק מים מזוקקים, מי גשם או מי אוסמוזה. מי ברז הורגים אותו תוך שבועות.',
      wr_split: 'השקיה בזמן הלא נכון גורמת לגוף להתפקע ולהיסדק. התזמון כאן חשוב יותר מהכמות.',
      wr_cold_min: 'לא לחשוף לטמפרטורה מתחת ל-10 מעלות. מרפסת פתוחה בלילות חורף קרים היא סיכון.',

      n_jewel: 'סחלב תכשיט מגדל שורשים זוחלים על פני המצע - לא לקבור אותם. שינויי אוורור פתאומיים גורמים לו לנשור עלים, ולכן מאווררים במנות קצרות ולא ברציפות.',
      n_calathea: 'קיפול העלים כלפי מעלה בלילה הוא תנועה טבעית ובריאה, ולא קמילה.',
      n_fittonia: 'מתמוטטת לגמרי כשהמצע מתייבש, וקמה תוך שעות אחרי השקיה. ההתמוטטות לא מזיקה בפעם אחת, אבל חוזרת עליה שוב ושוב מחלישה אותה.',
      n_alocasia: 'זן מגוון עם מעט כלורופיל מייצר פחות אנרגיה ולכן גדל לאט מטבעו - זו לא תוצאה של טיפול לקוי, ודישון מוגבר לא יעזור.',
      n_sansevieria: 'מנובמבר עד פברואר להכפיל את המרווח. סנסיווריה מתה מהצפה חורפית הרבה יותר מאשר מהזנחה.',
      n_echeveria: 'רוזטה שמתארכת ומרווחת בין העלים מבקשת אור, לא מים. אפשר לקטום את הראש, לתת לו להתייבש יומיים ולשתול מחדש.',
      n_panda: 'קצוות חומים על העלים השעירים הם הצבע הטבעי של הזן ולא נזק.',
      n_hoya: 'פורחת מעוקצים קצרים שחוזרים שנה אחר שנה. עלים מצומקים בזמן שהשאר בסדר מעידים על בעיה בשורשים או במצע, לא על צמא.',
      n_cryptanthus: 'ברומליאדה פורחת פעם אחת ואז דועכת, אבל משאירה שלוחות בבסיס. מפרידים אותן כשהן מגיעות לשליש מגודל האם.',
      n_lithops: 'חלון ההשקיה שלו הוא ספטמבר עד נובמבר - עונת הצמיחה והפריחה. בקיץ ובאמצע החורף: יבש לגמרי. בזמן החלפת העלים באביב לא משקים בכלל, העלים הישנים מזינים את החדשים.',
      n_caudex: 'הפקעת חייבת להישאר מעל פני המצע. כשהעלים מתייבשים באביב זה סימן להפסיק מים לגמרי, לא לנסות להציל.',
      n_caladium: 'הפקעת נשמרת יבשה בחורף ב-13-18 מעלות. שתילה מחדש כשהמצע מתחמם, והנבטים חוזרים תוך 2-4 שבועות.',
      n_rhipsalis: 'קקטוס יער אפיפיטי ולא קקטוס מדברי - רוצה יותר מים ופחות שמש ממה שנותנים לקקטוס רגיל.',
      n_ceropegia: 'קצוות שנגזמו אפשר לנעוץ בחזרה לאותו עציץ - הם משרישים ומעבים אותו.',
      n_euphorbia_milii: 'ככל שיש יותר אור כך הפריחה צפופה יותר, והיא יכולה להימשך כמעט כל השנה.',
      n_portulacaria: 'כל ענף שנגזם משריש בקלות במצע יבש - זה הצמח הכי פשוט להכפלה באוסף.',
      n_cactus: 'מדצמבר עד פברואר לא משקים בכלל. היובש החורפי הוא מה שמפעיל את הפריחה באביב.',
      n_dracaena: 'קצוות חומים בדרך כלל מקורם במלחים ובפלואוריד שבמי הברז, יותר מאשר בלחות אוויר נמוכה.',
      n_moss: 'טחב שותה מהאוויר ולא מהשורש. הוא מחוויר ומחמים כשהאקלים מתייבש, ומתאושש כשהלחות חוזרת.'
    },

    en: {
      season_now: 'Current season: {s}',
      s_summer: 'Summer', s_autumn: 'Autumn', s_winter: 'Winter', s_spring: 'Spring',
      h_light: 'Light', h_season: 'Seasonality', h_soil: 'Substrate', h_water: 'Watering and frequency',
      h_warn: 'Watch out for',
      freq_title: 'Recommended interval between waterings, by season',
      freq_none: 'none',
      freq_no_schedule: 'not on a schedule',
      applied_now: 'Currently set to every {n} days.',
      applied_none: 'No watering interval is set.',
      apply_btn: 'Set to {n} days for this season',
      applying: 'Updating...',
      apply_failed: 'Update failed: ',
      unknown_title: 'No precise data for this species',
      unknown_body: 'This plant is not in the app care database, and we will not guess. Check the Latin name (the English field) - once it is recognised the details appear here automatically. Until then: bright indirect light, a free-draining mix, and water only when the top 2-3 cm feel dry.',
      gl_indoor: 'Under a grow light: 25-35 cm from the lamp, 12-14 hours a day.',
      gl_sun: 'A grow light alone is usually not enough for a sun plant - it needs real sun or a very strong lamp placed close.',
      gl_shade: 'Under a grow light: 40 cm or more, or at the edge of the beam. A strong lamp up close will bleach the leaves.',

      l_full_sun: 'Full sun - six hours or more of direct sun a day. A south or west window, or an open balcony. Less than that and the plant stretches and loses its shape and colour.',
      l_sun_am: 'Direct sun in the morning only, shade during the hottest hours. An east window is ideal.',
      l_bright_indirect: 'Bright indirect light - near a window but out of the direct beam, or behind a sheer curtain. Midday sun burns the leaves.',
      l_medium: 'Medium light - one to three metres from a window, or a north window. It will not tolerate strong direct sun.',
      l_low_ok: 'Tolerates low light, but not darkness. In weak light growth slows sharply, leaves pale and stems stretch - that is a request for light, not a disease.',

      sn_summer_grower: 'A summer grower - its growing season runs from spring to late autumn. Feed only then, and stop completely from December to February.',
      sn_winter_grower: 'A winter grower on a reversed calendar: it wakes in September-October as the heat breaks, grows and flowers all winter, and sleeps in spring. In high summer it is dormant - watering then rots it.',
      sn_evergreen_indoor: 'An evergreen houseplant - it grows nearly year round with a clear slowdown from December to February. Reduce water and stop feeding in those months.',
      sn_winter_rest: 'Slows sharply in winter and may drop some leaves - that is a partial dormancy, not a disease. Cut watering back hard from December to February and wait; leaves return once the mix warms.',
      sn_winter_dormant: 'Goes fully dormant: in late autumn the leaves yellow and fall - entirely normal. The tuber rests dry until spring with no water at all. Watering a dormant tuber rots it.',
      sn_terrarium: 'Inside a terrarium seasonality is muted - the climate in there is nearly constant. Still, less light in winter means slower growth and less need to intervene.',

      so_gritty: 'A very free-draining mix: 50-70% mineral (perlite, pumice, coarse sand or akadama) with a little compost. Water should run straight through, never pool.',
      so_aroid: 'An airy aroid mix: pine bark + perlite + coco coir with a little soil. The aerial roots need oxygen and suffocate in ordinary potting soil.',
      so_moist_rich: 'A rich mix that holds moisture without staying waterlogged: coco or peat + perlite + a little compost. It should feel like a wrung-out sponge, not mud.',
      so_bark_epiphyte: 'A coarse epiphyte mix: pine bark, sphagnum and charcoal - almost no soil. In the wild this plant sits on a tree, not in the ground.',
      so_terrarium: 'Terrarium layers: drainage (leca or gravel) at the bottom, a separating mesh, then a forest mix with sphagnum and activated charcoal.',
      so_standard: 'Good potting soil with 20-30% added perlite for drainage. A drainage hole is mandatory.',

      w_dry_fully: 'Water only when the mix is bone dry all the way down, not just at the surface. Push a finger or a skewer to mid-pot: clean and dry means water. In doubt, wait another week.',
      w_dry_two_thirds: 'Let the top two thirds of the mix dry out between waterings, then water properly until it runs from the drainage hole.',
      w_dry_top_third: 'Water when the top third of the mix is dry. Water thoroughly until it drains, and empty the saucer after ten minutes.',
      w_dry_top_layer: 'Water when the top 2-3 cm feel dry to the touch. Never let the root ball dry out completely.',
      w_evenly_moist: 'Keep the moisture even and steady - neither muddy nor dry. Little and often beats one rare flooding.',
      w_orchid_soak: 'Soak: stand the pot in water for 10-15 minutes, then let it drain completely. Never leave water sitting in the decorative outer pot.',
      w_condensation: 'A closed terrarium is not watered on a schedule. The measure is condensation on the glass: light morning fog that clears during the day means it is balanced. No condensation for several days running means mist lightly. Droplets running all day means vent it, do not add water.',

      wr_rot: 'Too much water is the number one danger. A wilting plant in wet mix has root rot, not thirst - watering again only speeds up the collapse.',
      wr_burn: 'Strong direct sun scorches the leaves: whitish or brown dry patches that never recover.',
      wr_fluoride: 'Sensitive to fluoride and chlorine in tap water, which shows as brown leaf tips. Use filtered water, or water left standing overnight.',
      wr_salts: 'Fertiliser salts build up in the mix and burn the root tips. Every few months flush the pot with plenty of water until it runs out of the bottom.',
      wr_no_rosette: 'Do not pour water into the centre of the rosette - water sitting there rots it from the middle out.',
      wr_no_wet_leaves: 'Do not wet the hairy leaves - the hairs hold water and the leaf rots underneath.',
      wr_farina: 'The pale powdery coating on the leaves is the plant own sunscreen. Do not touch or wipe it - it does not grow back.',
      wr_sap: 'The white sap irritates skin and eyes and is toxic if swallowed. Wear gloves when pruning and rinse on contact.',
      wr_humidity: 'Needs high air humidity. Dry air shows as brown tips and invites spider mites.',
      wr_draft: 'Sensitive to cold draughts - keep it away from air conditioning, fans and open winter windows.',
      wr_leggy: 'Stretches and goes bare when short of light. Pinching encourages density, and the cuttings root easily - push them back into the same pot.',
      wr_repot_tight: 'Likes being pot-bound. Repotting too early delays flowering by a year.',
      wr_keep_spurs: 'Never cut off the old flower spurs - next year the flowers come back from exactly those.',
      wr_distilled: 'Distilled, rain or reverse-osmosis water only. Tap water kills it within weeks.',
      wr_split: 'Watering at the wrong time makes the body split open. Timing matters more than quantity here.',
      wr_cold_min: 'Do not expose it below 10 degrees. An open balcony on cold winter nights is a real risk.',

      n_jewel: 'A jewel orchid grows creeping roots along the surface - do not bury them. Sudden changes in airflow make it drop leaves, so vent in short bursts rather than continuously.',
      n_calathea: 'Leaves folding upward at night is a natural, healthy movement, not wilting.',
      n_fittonia: 'Collapses completely when the mix dries out and stands back up within hours of watering. One collapse does no harm, but repeated ones weaken it.',
      n_alocasia: 'A variegated form has little chlorophyll, makes less energy and is therefore naturally slow - that is not poor care, and extra feeding will not fix it.',
      n_sansevieria: 'From November to February double the interval. Sansevieria dies of winter overwatering far more often than of neglect.',
      n_echeveria: 'A rosette that stretches with gaps between the leaves is asking for light, not water. You can behead it, let the cut dry two days and replant.',
      n_panda: 'Brown edges on the furry leaves are the natural colour of the variety, not damage.',
      n_hoya: 'It flowers from short spurs that return year after year. Shrivelled leaves while the rest look fine point to a root or substrate problem, not thirst.',
      n_cryptanthus: 'A bromeliad flowers once and then declines, but leaves pups at the base. Separate them once they reach a third of the mother size.',
      n_lithops: 'Its watering window is September to November - the growth and flowering season. In summer and midwinter: bone dry. During the spring leaf change do not water at all; the old leaves feed the new ones.',
      n_caudex: 'The caudex must stay above the surface. When the leaves dry off in spring that is the signal to stop water entirely, not to rescue it.',
      n_caladium: 'The tuber is stored dry over winter at 13-18 degrees. Replant when the mix warms and shoots return within 2-4 weeks.',
      n_rhipsalis: 'An epiphytic forest cactus, not a desert one - it wants more water and less sun than a regular cactus.',
      n_ceropegia: 'Trimmed ends can be pushed straight back into the same pot - they root and thicken it up.',
      n_euphorbia_milii: 'The more light it gets the denser the flowering, and it can carry on almost all year.',
      n_portulacaria: 'Every pruned branch roots easily in dry mix - the simplest plant in the collection to multiply.',
      n_cactus: 'From December to February do not water at all. That winter drought is what triggers spring flowering.',
      n_dracaena: 'Brown tips usually come from salts and fluoride in tap water rather than from low air humidity.',
      n_moss: 'Moss drinks from the air, not through roots. It pales and browns when the climate dries out and recovers when humidity returns.'

      unknown_title: 'Точных данных по этому виду нет',
      unknown_body: 'Это растение отсутствует в базе условий выращивания, и мы не будем угадывать. Проверьте латинское название (поле на английском) - как только вид распознан, данные появятся здесь автоматически. А пока: яркий рассеянный свет, хорошо дренированный субстрат и полив только когда верхние 2-3 см просохли.',
      gl_indoor: 'Под фитолампой: 25-35 см от лампы, 12-14 часов в сутки.',
      gl_sun: 'Одной фитолампы солнечному растению обычно мало - нужно настоящее солнце или очень мощная лампа вблизи.',
      gl_shade: 'Под фитолампой: от 40 см и дальше, или с краю светового пятна. Мощная лампа вблизи обесцветит листья.',

      l_full_sun: 'Полное солнце - шесть и более часов прямого солнца в день. Южное или западное окно, либо открытый балкон. При меньшем свете растение вытягивается и теряет форму и цвет.',

      l_bright_indirect: 'Яркий рассеянный свет - рядом с окном, но вне прямых лучей, или за тонкой занавеской. Полуденное солнце обжигает листья.',
      l_medium: 'Средний свет - один-три метра от окна или северное окно. Сильного прямого солнца не выносит.',

      sn_summer_grower: 'Летний тип роста - сезон с весны до поздней осени. Подкормки только в это время, с декабря по февраль полностью прекратить.',
      sn_winter_grower: 'Зимний тип роста, календарь перевернут: просыпается в сентябре-октябре, когда спадает жара, растет и цветет всю зиму, засыпает весной. В разгар лета спит - полив в это время приводит к гнили.',
      sn_evergreen_indoor: 'Вечнозеленое комнатное растение - растет почти круглый год с заметным замедлением с декабря по февраль. В эти месяцы меньше воды и никаких подкормок.',
      sn_winter_rest: 'Зимой сильно замедляется и может сбросить часть листьев - это частичный покой, а не болезнь. С декабря по февраль резко сократить полив и подождать; листья вернутся, когда субстрат прогреется.',
      sn_winter_dormant: 'Уходит в полный покой: поздней осенью листья желтеют и опадают - это совершенно нормально. Клубень отдыхает сухим до весны, без полива вообще. Полив в покое губит его.',
      sn_terrarium: 'В террариуме сезонность сглажена - климат внутри почти постоянный. Но зимой света меньше, рост медленнее, и вмешиваться нужно реже.',

      so_gritty: 'Очень хорошо дренированный субстрат: 50-70% минеральной части (перлит, пемза, крупный песок или акадама) и немного компоста. Вода должна проходить сразу и не застаиваться.',
      so_aroid: 'Воздухопроницаемая смесь для ароидных: сосновая кора + перлит + кокос и немного земли. Воздушным корням нужен кислород, в обычном грунте они задыхаются.',
      so_moist_rich: 'Питательный субстрат, удерживающий влагу, но без застоя: кокос или торф + перлит + немного компоста. На ощупь как отжатая губка, а не грязь.',
      so_bark_epiphyte: 'Грубый эпифитный субстрат: сосновая кора, сфагнум и уголь, почти без земли. В природе растение сидит на дереве, а не в почве.',
      so_terrarium: 'Слои террариума: дренаж (керамзит или гравий) внизу, разделительная сетка, сверху лесной субстрат со сфагнумом и активированным углем.',
      so_standard: 'Качественный грунт с добавлением 20-30% перлита для дренажа. Дренажное отверстие обязательно.',

      w_dry_fully: 'Поливать только когда субстрат просох полностью на всю глубину, а не только сверху. Палец или шпажка до середины горшка: чисто и сухо - можно поливать. Сомневаетесь - подождите еще неделю.',
      w_dry_two_thirds: 'Дать просохнуть верхним двум третям субстрата, затем полить как следует, до вытекания из дренажа.',
      w_dry_top_third: 'Поливать, когда верхняя треть субстрата сухая. Полив обильный, до дренажа, поддон опорожнить через десять минут.',
      w_dry_top_layer: 'Поливать, когда верхние 2-3 см сухие на ощупь. Не давать кому пересыхать полностью.',
      w_evenly_moist: 'Поддерживать ровную постоянную влажность - не грязь и не сушь. Понемногу и чаще лучше, чем один редкий залив.',
      w_orchid_soak: 'Замачивание: поставить горшок в воду на 10-15 минут, затем дать полностью стечь. Никогда не оставлять воду в декоративном кашпо.',
      w_condensation: 'Закрытый террариум не поливают по графику. Показатель - конденсат на стекле: легкий утренний туман, который расходится за день, означает баланс. Нет конденсата несколько дней подряд - слегка опрыскать. Капли текут весь день - проветрить, а не доливать воду.',

      wr_rot: 'Избыток воды - главная опасность. Вянущее растение во влажном субстрате страдает от корневой гнили, а не от жажды, и повторный полив только ускорит гибель.',
      wr_burn: 'Сильное прямое солнце обжигает листья: белесые или коричневые сухие пятна, которые не восстанавливаются.',
      wr_fluoride: 'Чувствительно к фтору и хлору в водопроводной воде - от этого коричневые кончики листьев. Лучше фильтрованная или отстоянная вода.',
      wr_salts: 'Соли удобрений накапливаются в субстрате и жгут кончики корней. Раз в несколько месяцев промывать горшок большим количеством воды до вытекания снизу.',

      wr_sap: 'Белый млечный сок раздражает кожу и глаза и ядовит при проглатывании. Обрезка в перчатках, при попадании сразу смыть.',

      n_alocasia: 'У вариегатной формы мало хлорофилла, она вырабатывает меньше энергии и потому растет медленно от природы - дело не в уходе, и усиленные подкормки не помогут.',
      n_sansevieria: 'С ноября по февраль удвоить интервал. Сансевиерия гибнет от зимнего перелива гораздо чаще, чем от забывчивости.',
      n_echeveria: 'Розетка, которая вытягивается с промежутками между листьями, просит света, а не воды. Можно срезать верхушку, подсушить срез два дня и посадить заново.',

      n_hoya: 'Цветет с коротких шпорцев, которые возвращаются год за годом. Сморщенные листья при общем нормальном виде указывают на проблему корней или субстрата, а не на жажду.',

      n_rhipsalis: 'Эпифитный лесной кактус, а не пустынный - ему нужно больше воды и меньше солнца, чем обычному кактусу.',
