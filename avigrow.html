    { re: /sedum|sempervivum|סדום/i, l: 'full_sun', sn: 'summer_grower', so: 'gritty', w: 'dry_fully', f: 14, warn: ['rot', 'no_rosette'] },
    { re: /mammillaria|opuntia|echinopsis|gymnocalycium|cereus|astrophytum|\bcactus\b|קקטוס/i, l: 'full_sun', sn: 'summer_grower', so: 'gritty', w: 'dry_fully', f: 16, warn: ['rot', 'burn'], note: 'n_cactus' },
    { re: /succulent|סוקולנט|בשרני/i, l: 'full_sun', sn: 'summer_grower', so: 'gritty', w: 'dry_fully', f: 14, warn: ['rot', 'no_rosette'] }
  ];

  // המפתח למאגר הוא השם הלטיני, ואם אין - השם העברי.
  function findCare(p) {
    const hay = ((p.nameEn || '') + ' ' + (p.nameHe || '')).trim();
    if (!hay) return null;
    for (let i = 0; i < CARE_DB.length; i++) {
      if (CARE_DB[i].re.test(hay)) return CARE_DB[i];
    }
    return null;
  }

  // צמח בטרריום מטופל אחרת גם אם המין עצמו מוכר: ההשקיה לא לפי לוח זמנים.
  function isTerrariumPlant(p) {
    return /טרריום|terrarium|террариум/i.test((p.nameHe || '') + ' ' + (p.nameEn || '') + ' ' + (p.notes || ''));
  }

  function careInterval(entry, season) {
    if (!entry || !entry.f) return null;
    const mult = (entry.wg ? SEASON_MULT_WINTER_GROWER : SEASON_MULT)[season];
    if (mult === null || mult === undefined) return null;
    return Math.max(1, Math.round(entry.f * mult));
  }

  const carePlantCache = {};

  function openCare(id) {
    const p = carePlantCache[id];
    if (!p) return;
    const season = currentSeason();
    let entry = findCare(p);
    const terrarium = isTerrariumPlant(p);
    // בטרריום דורסים את שיטת ההשקיה ואת העונתיות, גם למין מוכר
    if (terrarium && entry) entry = Object.assign({}, entry, { w: 'condensation', sn: 'terrarium', f: null });

    document.getElementById('care-title').textContent = p.nameHe || '';
    const latinEl = document.getElementById('care-latin');
    latinEl.textContent = p.nameEn || '';
    latinEl.style.display = p.nameEn ? 'block' : 'none';

    const body = document.getElementById('care-body');
    if (!entry) {
      body.innerHTML =
        '<div class="care-unknown"><strong>' + escapeHtml(ct('unknown_title')) + '</strong><br>' +
        escapeHtml(ct('unknown_body')) + '</div>';
    } else {
      const glKey = entry.l === 'full_sun' || entry.l === 'sun_am' ? 'gl_sun'
        : (entry.l === 'low_ok' || entry.l === 'medium' ? 'gl_shade' : 'gl_indoor');

      let html =
        '<div class="care-season-now">' + escapeHtml(ct('season_now', { s: ct('s_' + season) })) + '</div>' +
        careBlock('h_light', ct('l_' + entry.l) + ' ' + ct(glKey)) +
        careBlock('h_season', ct('sn_' + entry.sn)) +
        careBlock('h_soil', ct('so_' + entry.so)) +
        careBlock('h_water', ct('w_' + entry.w) + (entry.note ? ' ' + ct(entry.note) : ''));

      // טבלת התדירות - רק לצמח שמושקה לפי לוח זמנים
      if (entry.f) {
        const seasons = ['spring', 'summer', 'autumn', 'winter'];
        html += '<div class="care-freq-wrap"><p class="care-freq-title">' + escapeHtml(ct('freq_title')) + '</p><div class="care-freq">' +
          seasons.map(s => {
            const d = careInterval(entry, s);
            return '<div class="' + (s === season ? 'now' : '') + '">' +
              '<span class="fs">' + escapeHtml(ct('s_' + s)) + '</span>' +
              '<span class="fd">' + escapeHtml(d === null ? '—' : String(d)) + '</span>' +
              '<span class="fs">' + escapeHtml(d === null ? ct('freq_none') : daysUnit(d)) + '</span></div>';
          }).join('') + '</div>';

        const rec = careInterval(entry, season);
        html += '<p class="care-current">' + escapeHtml(p.wateringIntervalDays
          ? ct('applied_now', { n: p.wateringIntervalDays })
          : ct('applied_none')) + '</p>';
        if (rec !== null && p.wateringIntervalDays !== rec) {
          html += '<button type="button" class="care-btn" id="care-apply-btn" onclick="applyCareInterval(' + p.id + ',' + rec + ')">' +
            escapeHtml(ct('apply_btn', { n: rec })) + '</button>' +
            '<p id="care-apply-status" class="photo-status"></p>';
        }
        html += '</div>';
      } else {
        html += '<p class="care-current">' + escapeHtml(ct('freq_no_schedule')) + '</p>';
      }

      if (entry.warn && entry.warn.length) {
        html += '<div class="care-warn"><h4>' + escapeHtml(ct('h_warn')) + '</h4><ul>' +
          entry.warn.map(w => '<li>' + escapeHtml(ct('wr_' + w)) + '</li>').join('') + '</ul></div>';
      }
      body.innerHTML = html;
    }

    document.getElementById('care-overlay').classList.add('open');
    document.addEventListener('keydown', careEscHandler);
  }

  function careBlock(titleKey, text) {
    return '<div class="care-block"><h4>' + escapeHtml(ct(titleKey)) + '</h4><p>' + escapeHtml(text) + '</p></div>';
  }

  function careEscHandler(e) { if (e.key === 'Escape') closeCare(); }

  function closeCare(e) {
    // לחיצה על הרקע סוגרת; לחיצה בתוך החלון עצמו לא
    if (e && e.target && e.target.id !== 'care-overlay' && e.type === 'click') return;
    document.getElementById('care-overlay').classList.remove('open');
    document.removeEventListener('keydown', careEscHandler);
  }

  // עדכון מרווח ההשקיה במערכת לפי ההמלצה העונתית
  async function applyCareInterval(id, days) {
    const statusEl = document.getElementById('care-apply-status');
    const btn = document.getElementById('care-apply-btn');
    if (statusEl) { statusEl.textContent = ct('applying'); statusEl.classList.remove('error'); }
    if (btn) btn.disabled = true;
    try {
      await updateWateringRow(id, { watering_interval_days: days });
      await renderPlants();
      closeCare();
    } catch (err) {
      console.error('Applying care interval failed:', (err && err.message) || String(err));
      if (statusEl) {
        statusEl.textContent = ct('apply_failed') + ((err && err.message) || String(err));
        statusEl.classList.add('error');
      }
      if (btn) btn.disabled = false;
    }
  }

  async function renderPlants() {
    const container = document.getElementById('plants-container');
    let allPlants;
    try {
      allPlants = await loadPlants();
    } catch (err) {
      console.error('Loading plants failed:', (err && err.message) || String(err));
      container.innerHTML = '<div class="empty-state">' + escapeHtml(t('load_failed')) +
        ((err && err.message) || String(err)) + '</div>';
      await updateStatLine(0);
      return;
    }

    updateHomeWateringFocus(allPlants);
    // חלון תנאי הגידול נפתח לפי id, ולכן צריך גישה לאובייקט הצמח אחרי הרינדור
    allPlants.forEach(p => { carePlantCache[p.id] = p; });
    const plants = filterPlants(allPlants);
    await updateStatLine(allPlants.length);

    if (allPlants.length === 0) {
      container.innerHTML = '<div class="empty-state">' + escapeHtml(t('empty_none')) + '</div>';
      return;
    }
    if (plants.length === 0) {
      container.innerHTML = '<div class="empty-state">' + escapeHtml(t('empty_search')) + '</div>';
      return;
    }

    container.innerHTML = '<div class="plants-grid">' + plants.map(p => `
      <div class="plant-card">
        <div class="photo-slot">
          ${p.photo ? `<img src="${p.photo}" alt="">` : '<div class="photo-empty">🌱</div>'}
          <input type="file" id="photo-input-${p.id}" class="card-photo-input" accept="image/*" onchange="changePlantPhoto(${p.id})">
          <label for="photo-input-${p.id}" class="photo-edit-btn">${escapeHtml(p.photo ? t('photo_replace') : t('photo_add'))}</label>
          <p id="photo-status-${p.id}" class="photo-status"></p>
        </div>
        <div class="body">
          <h3>${p.nameHe}${p.source === 'web' ? '<span class="source-badge">' + escapeHtml(t('badge_web')) + '</span>' : ''}</h3>
          ${p.nameEn ? `<div class="en-name">${p.nameEn}</div>` : ''}
          ${p.notes ? `<div class="notes">${p.notes}</div>` : ''}
          <div class="date">${escapeHtml(t('added_on'))} ${p.addedAt}</div>

          ${p.source === 'web' ? '' : (() => {
            const w = computeWateringStatus(p);
            return `
          <div class="watering-box">
            <div class="watering-row">
              <label for="watering-interval-${p.id}">${escapeHtml(t('w_every'))}</label>
              <input type="number" min="1" id="watering-interval-${p.id}" value="${p.wateringIntervalDays || ''}" placeholder="${escapeHtml(t('w_days_ph'))}">
              <span class="sub" style="margin:0;">${escapeHtml(t('w_days_ph'))}</span>
              <button type="button" class="btn btn-ghost watering-save-btn" onclick="saveWateringInterval(${p.id})">${escapeHtml(t('save'))}</button>
            </div>
            <p id="watering-save-status-${p.id}" class="identify-status error" style="display:none;"></p>
            ${w ? `
              <div class="watering-status ${w.cls}">${w.text}</div>
              <button type="button" class="btn watering-done-btn" onclick="markWatered(${p.id})">${escapeHtml(t('w_done'))}</button>
            ` : ''}
          </div>
          <input type="file" id="health-input-${p.id}" class="health-input" accept="image/*" onchange="checkPlantHealth(${p.id})">
          <label for="health-input-${p.id}" class="health-btn">${escapeHtml(t('health_btn'))}</label>
          <p id="health-status-${p.id}" class="health-status-msg"></p>
          `; })()}

          ${p.health ? `
            <div class="health-result ${p.health.status === 'תקין' ? '' : 'warn'}">
              <span class="h-status">${p.health.status === 'תקין' ? '✓ תקין' : '⚠ ' + p.health.status}</span>
              ${p.health.diagnosis}
              <br>${p.health.advice}
              <span class="h-date">${escapeHtml(t('checked_on'))} ${p.health.date}</span>
            </div>
          ` : ''}

          <button type="button" class="care-btn" onclick="openCare(${p.id})">${escapeHtml(t('care_btn'))}</button>

          <button class="delete-btn" onclick="deletePlant(${p.id})">${escapeHtml(t('delete_plant'))}</button>
        </div>
      </div>
    `).join('') + '</div>';
  }

  async function deletePlant(id) {
    try {
      await deletePlantRow(id);
      await renderPlants();
    } catch (err) {
      console.error('Delete failed:', (err && err.message) || String(err));
      showGlobalError((err && err.message) || String(err));
    }
  }

  // ===== בדיקת בריאות צמח קיים =====
  // אותו עיקרון כמו זיהוי השם, רק עם פרומפט שונה שמבקש אבחון מצב הצמח
  async function checkPlantHealth(plantId) {
    const inputEl = document.getElementById(`health-input-${plantId}`);
    const file = inputEl && inputEl.files[0];
    if (!file) return;

    const statusEl = document.getElementById(`health-status-${plantId}`);
    const reader = new FileReader();

    reader.onload = async (e) => {
      const dataUrl = await compressImage(e.target.result);
      const match = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/);
      if (!match) return;
      const mediaType = match[1];
      const base64Data = match[2];

      statusEl.textContent = t('checking');

      // פסק זמן: אם אין תשובה תוך 20 שניות, לא נישאר תקועים לנצח
      function withTimeout(promise, ms, message) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
        ]);
      }

      try {
        const data = await withTimeout(
          callPlantAI(
            "אתה מומחה לבריאות צמחי בית. תשיב אך ורק באובייקט JSON תקני, בלי טקסט נוסף ובלי גדרות markdown, בפורמט: {\"status\": \"תקין\" או תיאור קצר של הבעיה כמו \"עלים צהובים\", \"diagnosis\": \"תיאור קצר במשפט אחד של מה שרואים בתמונה\", \"advice\": \"המלצת טיפול קצרה וברורה\"}. אם התמונה לא מספיק ברורה לאבחון מהימן, ציין זאת בשדה diagnosis וההמלצה תהיה לצלם מזווית/תאורה טובה יותר.",
            mediaType,
            base64Data,
            "בדוק את מצב הבריאות של הצמח בתמונה הזו. השב בשפה: " + LANG_NAMES[currentLang]
          ),
          20000,
          'הבדיקה לקחה יותר מדי זמן - נסי שוב'
        );

        if (data.error) throw new Error(data.error.message || 'שגיאת שרת בבדיקה');

        const textBlock = (data.content || []).find(b => b.type === "text");
        if (!textBlock) throw new Error("לא התקבלה תשובת טקסט מהבדיקה");

        const jsonMatch = textBlock.text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("תשובת הבדיקה לא הייתה בפורמט תקין");
        const parsed = JSON.parse(jsonMatch[0]);

        await updatePlantHealthRow(plantId, {
          status: parsed.status || 'לא ידוע',
          diagnosis: parsed.diagnosis || '',
          advice: parsed.advice || ''
        });
        await renderPlants(); // מרענן את כל הרשימה כדי להציג את התוצאה החדשה
      } catch (err) {
        console.error('Health check failed:', (err && err.message) || String(err));
        // שולפים מחדש את האלמנט כי renderPlants() אולי כבר החליף את ה-DOM
        const freshStatusEl = document.getElementById(`health-status-${plantId}`);
        const msg = t('check_failed') + (err && err.message ? err.message : String(err));
        if (freshStatusEl) freshStatusEl.textContent = msg;
        showGlobalError(msg);
      }
    };

    reader.readAsDataURL(file);
  }

  // ===== בדיקת בריאות מהירה - בלי צמח קיים ברשימה =====
  // אותו עיקרון בדיוק כמו checkPlantHealth, רק שהתוצאה מוצגת במקום ולא נשמרת לצמח מסוים
  const quickHealthInput = document.getElementById('quick-health-input');
  const quickHealthPreview = document.getElementById('quick-health-preview');
  const quickHealthStatus = document.getElementById('quick-health-status');
  const quickHealthResult = document.getElementById('quick-health-result');

  function withTimeout(promise, ms, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
    ]);
  }

  quickHealthInput.addEventListener('change', async () => {
    const file = quickHealthInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = await compressImage(e.target.result);
      quickHealthPreview.src = dataUrl;
      quickHealthPreview.style.display = 'block';

      const match = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/);
      if (!match) return;
      const mediaType = match[1];
      const base64Data = match[2];

      quickHealthResult.innerHTML = '';
      quickHealthStatus.textContent = t('checking');
      quickHealthStatus.classList.remove('error');

      try {
        const data = await withTimeout(
          callPlantAI(
            "אתה מומחה לבריאות צמחי בית. תשיב אך ורק באובייקט JSON תקני, בלי טקסט נוסף ובלי גדרות markdown, בפורמט: {\"status\": \"תקין\" או תיאור קצר של הבעיה, \"diagnosis\": \"תיאור קצר במשפט אחד\", \"advice\": \"המלצת טיפול קצרה\"}. אם לא ברור, ציין זאת ב-diagnosis.",
            mediaType,
            base64Data,
            "בדוק את מצב הבריאות של הצמח בתמונה הזו. השב בשפה: " + LANG_NAMES[currentLang]
          ),
          20000,
          'הבדיקה לקחה יותר מדי זמן - נסי שוב'
        );

        if (data.error) throw new Error(data.error.message || 'שגיאת שרת בבדיקה');

        const textBlock = (data.content || []).find(b => b.type === "text");
        if (!textBlock) throw new Error("לא התקבלה תשובת טקסט מהבדיקה");
        const jsonMatch = textBlock.text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("תשובת הבדיקה לא הייתה בפורמט תקין");
        const parsed = JSON.parse(jsonMatch[0]);

        quickHealthStatus.textContent = '';
        const isOk = parsed.status === 'תקין';
        quickHealthResult.innerHTML = `
          <div class="quick-health-result-box ${isOk ? '' : 'warn'}">
            <strong>${isOk ? '✓ תקין' : '⚠ ' + parsed.status}</strong><br>
            ${parsed.diagnosis || ''}<br>${parsed.advice || ''}
          </div>
        `;
      } catch (err) {
        console.error('Quick health check failed:', (err && err.message) || String(err));
        quickHealthStatus.textContent = t('check_failed') + ((err && err.message) || String(err));
        quickHealthStatus.classList.add('error');
      }
    };
    reader.readAsDataURL(file);
  });

  // ===== חיפוש צמח באינטרנט (ויקיפדיה) =====
  // אין צורך במפתח API - ה-API הציבורי של ויקיפדיה תומך בקריאות ישירות מהדפדפן (CORS פתוח דרך origin=*).
  // מחפשים קודם בוויקיפדיה העברית, ואם אין תוצאות עוברים לאנגלית.
  const webSearchInput = document.getElementById('web-search-input');
  const webSearchStatus = document.getElementById('web-search-status');
  const webSearchResults = document.getElementById('web-search-results');
  let webSearchTimer = null;
  let webSearchToken = 0; // מונע מתוצאות של חיפוש ישן "לדרוס" תוצאות חדשות יותר

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ===== חיפוש צמח באינטרנט =====
  // שתי תקלות שהיו כאן ותוקנו:
  // 1. הקטגוריות של כל הדפים נשלפו עם cllimit אחד משותף, ולכן חלק מהדפים חזרו
  //    בלי קטגוריות בכלל - ואותו חיפוש בדיוק הצליח פעם אחת ונכשל בפעם הבאה.
  //    הקטגוריות כבר לא בשימוש, אז התלות הלא-יציבה הזו נעלמה.
  // 2. הסינון "נראה כמו צמח" חיפש מילות מפתח בתקציר, ולכן החזיר גם זמרים,
  //    שירים ומשקאות. עכשיו כל תוצאה נבדקת מול ויקינתונים: היא נכללת רק אם היא
  //    טקסון (P31 = Q16521) שיש לו מזהה באחד ממאגרי הצמחים העולמיים. זה מסנן
  //    החוצה גם בעלי חיים ופטריות ששמם מזכיר צמח (למשל "גדרון הקקטוס", ציפור).

  const WD_TAXON = 'Q16521';
  const WD_PLANT_DB_PROPS = ['P5037', 'P961', 'P1772', 'P1421', 'P1070'];

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('(' + res.status + ')');
    return res.json();
  }

  // מועמדים מוויקיפדיה בשפה מסוימת: רק דפים עם תמונה ועם מזהה ויקינתונים
  async function wikiCandidates(lang, query) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search` +
      `&gsrsearch=${encodeURIComponent(query)}&gsrlimit=12` +
      `&prop=pageimages|extracts|pageprops&ppprop=wikibase_item` +
      `&piprop=thumbnail&pithumbsize=400&exintro=1&explaintext=1&exchars=220` +
      `&format=json&origin=*`;
    const data = await fetchJson(url);
    const pages = (data.query && data.query.pages) ? Object.values(data.query.pages) : [];
    return pages
      .filter(pg => pg.thumbnail && pg.thumbnail.source)
      .filter(pg => pg.pageprops && pg.pageprops.wikibase_item)
      .sort((a, b) => (a.index || 0) - (b.index || 0)) // סדר המפתחות ב-JSON אינו סדר הרלוונטיות
      .map(pg => ({
        title: pg.title,
        extract: pg.extract || '',
        thumbnail: pg.thumbnail.source,
        qid: pg.pageprops.wikibase_item,
        lang
      }));
  }

  // ויקינתונים מגבילה קצב בקשות (429) ומחזירה שגיאה כשמחפשים כמה פעמים ברצף.
  // לכן כל תשובה נשמרת בזיכרון לכל אורך הביקור, וכל ערך נבדק פעם אחת בלבד.
  const plantCheckCache = new Map(); // qid -> true/false

  // בקשה אחת לוויקינתונים לכל המועמדים החדשים יחד, ומחזירה רק את אלה שהם באמת צמחים
  async function keepOnlyPlants(candidates) {
    if (!candidates.length) return [];
    const unknown = candidates.filter(c => !plantCheckCache.has(c.qid));

    if (unknown.length) {
      const url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' +
        encodeURIComponent(unknown.map(c => c.qid).join('|')) + '&props=claims&format=json&origin=*';
      let data = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        try { data = await fetchJson(url); break; }
        catch (err) {
          if (attempt === 1) throw err;
          await new Promise(r => setTimeout(r, 700)); // הגבלת קצב חולפת מהר - ניסיון שני
        }
      }
      const entities = (data && data.entities) || {};
      unknown.forEach(c => {
        const claims = (entities[c.qid] || {}).claims || {};
        const isTaxon = (claims.P31 || []).some(st => {
          const dv = st.mainsnak && st.mainsnak.datavalue;
          return !!(dv && dv.value && dv.value.id === WD_TAXON);
        });
        plantCheckCache.set(c.qid, isTaxon && WD_PLANT_DB_PROPS.some(prop => claims[prop]));
      });
    }
    return candidates.filter(c => plantCheckCache.get(c.qid));
  }

  async function runWebSearch(query) {
    const myToken = ++webSearchToken;
    webSearchStatus.textContent = t('searching');
    webSearchStatus.classList.remove('error');
    webSearchResults.innerHTML = '';

    // מחפשים קודם בשפת הממשק, ואם אין תוצאות - גם בשתי השפות האחרות,
    // כך שאפשר להקליד שם צמח בעברית, באנגלית או ברוסית בלי להחליף שפה.
    const order = [LANGS[currentLang].wiki, 'en', 'he', 'ru']
      .filter((v, idx, arr) => arr.indexOf(v) === idx);

    let results = [];
    let lastError = null;
    for (const lang of order) {
      let candidates = [];
      try {
        candidates = await wikiCandidates(lang, query);
      } catch (err) { lastError = err; continue; }
      if (myToken !== webSearchToken) return; // חיפוש חדש כבר התחיל בינתיים
      if (!candidates.length) continue;

      try {
        results = await keepOnlyPlants(candidates);
      } catch (err) { lastError = err; results = []; }
      if (myToken !== webSearchToken) return;
      if (results.length) break;
    }

    if (!results.length) {
      const msg = (lastError && lastError.message) || String(lastError || '');
      if (lastError) {
        // 429 = ויקינתונים מגבילה קצב. זו תקלה זמנית, לא "אין תוצאות" - חשוב שההודעה תבדיל
        webSearchStatus.textContent = msg.indexOf('429') !== -1 ? t('search_busy') : t('search_failed') + msg;
        webSearchStatus.classList.add('error');
      } else {
        webSearchStatus.textContent = t('no_results');
      }
      return;
    }
    webSearchStatus.textContent = '';

    webSearchResults.innerHTML = results.map((r, i) => `
      <div class="web-result-card">
        <img src="${r.thumbnail}" alt="" loading="lazy">
        <div class="wr-body">
          <h4>${escapeHtml(r.title)}</h4>
          <p>${escapeHtml(r.extract)}</p>
          <button type="button" class="btn" data-idx="${i}">${escapeHtml(t('add_to_list'))}</button>
        </div>
      </div>
    `).join('');

    webSearchResults.querySelectorAll('button[data-idx]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const r = results[Number(btn.dataset.idx)];
        btn.disabled = true;
        btn.textContent = t('adding');
        try {
          await insertPlant({
            nameHe: r.title,                            // שם התצוגה - תמיד בשפה שבה נמצא
            nameEn: r.lang === 'en' ? r.title : '',
            notes: r.extract,
            photo: r.thumbnail,
            source: 'web'
          });
          btn.textContent = t('added');
          await renderPlants();
        } catch (err) {
          console.error('Adding web plant failed:', (err && err.message) || String(err));
          btn.textContent = t('add_failed');
          btn.disabled = false;
        }
      });
    });
  }

  webSearchInput.addEventListener('input', () => {
    const query = webSearchInput.value.trim();
    clearTimeout(webSearchTimer);
    webSearchToken++; // כל הקלדה מבטלת תוצאות של חיפוש קודם שעדיין באוויר
    if (!query) {
      webSearchStatus.textContent = '';
      webSearchStatus.classList.remove('error');
      webSearchResults.innerHTML = '';
      return;
    }
    webSearchTimer = setTimeout(() => runWebSearch(query), 400); // דיבאונס - לא בקשה על כל תו
  });

  // ===== אימות משתמשים - שער כניסה באימייל =====
  // כל משתמש מזוהה ע"י Supabase Auth (auth.uid()); הצמחים שלו מסוננים אוטומטית
  // ע"י ה-RLS policies שהוגדרו על הטבלה (auth.uid() = user_id).
  let currentUserId = null;
  const LOGIN_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000; // 30 יום - אחריהם נבקש התחברות מחדש

  function showGate() {
    document.getElementById('app-wrap').style.display = 'none';
    const gate = document.getElementById('auth-gate');
    gate.style.display = 'flex';
    document.getElementById('auth-step-form').style.display = 'block';
    document.getElementById('auth-step-sent').style.display = 'none';
  }

  async function showApp() {
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('app-wrap').style.display = 'block';
    await renderPlants();
    // סיור פתיחה קצר - רק בכניסה הראשונה של המשתמש הזה
    scheduleTour('home', null, 800);
  }

  // יוצר/מעדכן שורת פרופיל (שם פרטי/משפחה) עבור המשתמש, ומציג אותו בתפריט
  async function ensureProfile(user) {
    const pendingFirst = localStorage.getItem('avigrow_pending_first');
    const pendingLast = localStorage.getItem('avigrow_pending_last');
    if (pendingFirst || pendingLast) {
      await sbClient.from('profiles').upsert({
        id: user.id,
        first_name: pendingFirst || '',
        last_name: pendingLast || '',
        email: user.email || null
      });
      localStorage.removeItem('avigrow_pending_first');
      localStorage.removeItem('avigrow_pending_last');
    } else {
      // עדכון שקט של המייל בכל כניסה (למקרה שהשתנה), בלי לגעת בשם השמור
      await sbClient.from('profiles').update({ email: user.email || null }).eq('id', user.id);
    }
    const { data } = await sbClient.from('profiles').select('first_name,last_name').eq('id', user.id).maybeSingle();
    const nameEl = document.getElementById('menu-user-name');
    if (nameEl) nameEl.textContent = data ? `${data.first_name} ${data.last_name}`.trim() : (user.email || '');

    // תפריט "ניהול מערכת" מוצג רק למנהלת (הרשאה אמיתית נאכפת ב-RLS, זה רק להצגה/הסתרה)
    const adminGroup = document.getElementById('admin-menu-group');
    if (adminGroup) adminGroup.style.display = (user.id === ADMIN_USER_ID) ? 'block' : 'none';
  }

  sbClient.auth.onAuthStateChange(async (event, session) => {
    try {
      if (session) {
        if (event === 'SIGNED_IN') {
          // כניסה חדשה (כולל לחיצה על קישור מהאימייל) - מתחילים ספירה חדשה של 30 יום
          localStorage.setItem('avigrow_login_at', String(Date.now()));
        }
        const loginAt = Number(localStorage.getItem('avigrow_login_at') || 0);
        const expired = !loginAt || (Date.now() - loginAt) > LOGIN_MAX_AGE_MS;
        if (expired) {
          localStorage.removeItem('avigrow_login_at');
          await sbClient.auth.signOut(); // יגרום לקריאה חוזרת לפונקציה הזו עם session ריק
          return;
        }
        currentUserId = session.user.id;
        await ensureProfile(session.user);
        await showApp();
      } else {
        currentUserId = null;
        showGate();
      }
    } catch (err) {
      console.error('Auth state handling failed:', (err && err.message) || String(err));
      showGate();
    }
  });

  // ===== טופס שער הכניסה =====
  const authSendBtn = document.getElementById('auth-send-btn');
  const authFormStatus = document.getElementById('auth-form-status');

  let pendingAuthEmail = '';

  authSendBtn.addEventListener('click', async () => {
    const firstName = document.getElementById('auth-first-name').value.trim();
    const lastName = document.getElementById('auth-last-name').value.trim();
    const email = document.getElementById('auth-email').value.trim();

    authFormStatus.classList.remove('error');
    if (!firstName || !lastName) {
      authFormStatus.textContent = t('need_names');
      authFormStatus.classList.add('error');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      authFormStatus.textContent = t('need_email');
      authFormStatus.classList.add('error');
      return;
    }

    authSendBtn.disabled = true;
    authFormStatus.textContent = t('sending');
    try {
      localStorage.setItem('avigrow_pending_first', firstName);
      localStorage.setItem('avigrow_pending_last', lastName);
      pendingAuthEmail = email;

      const { error } = await sbClient.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: true, data: { first_name: firstName, last_name: lastName } }
      });
      if (error) throw error;

      document.getElementById('auth-sent-email').textContent = email;
      document.getElementById('auth-step-form').style.display = 'none';
      document.getElementById('auth-step-sent').style.display = 'block';
      document.getElementById('auth-code').value = '';
      document.getElementById('auth-code').focus();
      authFormStatus.textContent = '';
    } catch (err) {
      console.error('Send OTP failed:', (err && err.message) || String(err));
      authFormStatus.textContent = t('send_failed') + ((err && err.message) || String(err));
      authFormStatus.classList.add('error');
    } finally {
      authSendBtn.disabled = false;
    }
  });

  const authVerifyBtn = document.getElementById('auth-verify-btn');
  const authVerifyStatus = document.getElementById('auth-verify-status');

  authVerifyBtn.addEventListener('click', async () => {
    const code = document.getElementById('auth-code').value.trim();
    authVerifyStatus.classList.remove('error');
    if (!/^\d{4,10}$/.test(code)) {
      authVerifyStatus.textContent = t('need_code');
      authVerifyStatus.classList.add('error');
      return;
    }

    authVerifyBtn.disabled = true;
    authVerifyStatus.textContent = t('verifying');
    try {
      const { error } = await sbClient.auth.verifyOtp({ email: pendingAuthEmail, token: code, type: 'email' });
      if (error) throw error;
      // הצלחה - onAuthStateChange יזהה SIGNED_IN ויעביר למסך הראשי
      authVerifyStatus.textContent = '';
    } catch (err) {
      console.error('Verify OTP failed:', (err && err.message) || String(err));
      authVerifyStatus.textContent = t('bad_code') + ((err && err.message) || String(err));
      authVerifyStatus.classList.add('error');
    } finally {
      authVerifyBtn.disabled = false;
    }
  });

  document.getElementById('auth-change-email-btn').addEventListener('click', () => {
    document.getElementById('auth-step-sent').style.display = 'none';
    document.getElementById('auth-step-form').style.display = 'block';
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    localStorage.removeItem('avigrow_login_at');
    await sbClient.auth.signOut();
  });

  // ===== עדכון פרטי משתמש (שם + אימייל) =====
  const accountFormStatus = document.getElementById('account-form-status');
  const accountSaveBtn = document.getElementById('account-save-btn');
  let accountOriginalEmail = '';

  document.getElementById('show-account-btn').addEventListener('click', async () => {
    showSection(accountSection);
    document.getElementById('account-step-form').style.display = 'block';
    document.getElementById('account-step-verify').style.display = 'none';
    accountFormStatus.textContent = '';

    const { data: { user } } = await sbClient.auth.getUser();
    if (!user) return;
    accountOriginalEmail = user.email || '';
    document.getElementById('account-email').value = accountOriginalEmail;

    const { data: profile } = await sbClient.from('profiles').select('first_name,last_name,notify_watering').eq('id', user.id).maybeSingle();
    document.getElementById('account-first-name').value = (profile && profile.first_name) || '';
    document.getElementById('account-last-name').value = (profile && profile.last_name) || '';
    // ברירת מחדל: התראות דלוקות אם אין עדיין ערך שמור (משתמש חדש/ישן לפני התוספת)
    document.getElementById('account-notify-watering').checked = !profile || profile.notify_watering !== false;
  });

  document.getElementById('close-account-btn').addEventListener('click', () => {
    accountSection.style.display = 'none';
  });

  accountSaveBtn.addEventListener('click', async () => {
    const firstName = document.getElementById('account-first-name').value.trim();
    const lastName = document.getElementById('account-last-name').value.trim();
    const newEmail = document.getElementById('account-email').value.trim();
    const notifyWatering = document.getElementById('account-notify-watering').checked;

    accountFormStatus.classList.remove('error');
    if (!firstName || !lastName) {
      accountFormStatus.textContent = t('need_names');
      accountFormStatus.classList.add('error');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) {
      accountFormStatus.textContent = t('need_email');
      accountFormStatus.classList.add('error');
      return;
    }

    accountSaveBtn.disabled = true;
    accountFormStatus.textContent = t('saving');
    try {
      const { data: { user } } = await sbClient.auth.getUser();
      const { error: profileError } = await sbClient.from('profiles')
        .update({ first_name: firstName, last_name: lastName, notify_watering: notifyWatering })
        .eq('id', user.id);
      if (profileError) throw profileError;
      document.getElementById('menu-user-name').textContent = `${firstName} ${lastName}`.trim();

      const emailChanged = newEmail.toLowerCase() !== accountOriginalEmail.toLowerCase();
      if (!emailChanged) {
        accountFormStatus.textContent = t('saved_ok');
        return;
      }

      // שינוי אימייל דורש אימות - הצמחים נשארים שייכים לאותו משתמש (user_id לא משתנה)
      const { error: emailError } = await sbClient.auth.updateUser({ email: newEmail });
      if (emailError) throw emailError;

      document.getElementById('account-new-email').textContent = newEmail;
      document.getElementById('account-step-form').style.display = 'none';
      document.getElementById('account-step-verify').style.display = 'block';
      document.getElementById('account-verify-code').value = '';
      document.getElementById('account-verify-code').focus();
      accountFormStatus.textContent = '';
    } catch (err) {
      console.error('Account update failed:', (err && err.message) || String(err));
      accountFormStatus.textContent = t('save_failed2') + ((err && err.message) || String(err));
      accountFormStatus.classList.add('error');
    } finally {
      accountSaveBtn.disabled = false;
    }
  });

  const accountVerifyBtn = document.getElementById('account-verify-btn');
  const accountVerifyStatus = document.getElementById('account-verify-status');

  accountVerifyBtn.addEventListener('click', async () => {
    const code = document.getElementById('account-verify-code').value.trim();
    const newEmail = document.getElementById('account-new-email').textContent;
    accountVerifyStatus.classList.remove('error');
    if (!/^\d{4,10}$/.test(code)) {
      accountVerifyStatus.textContent = t('need_code');
      accountVerifyStatus.classList.add('error');
      return;
    }

    accountVerifyBtn.disabled = true;
    accountVerifyStatus.textContent = t('verifying');
    try {
      const { error } = await sbClient.auth.verifyOtp({ email: newEmail, token: code, type: 'email_change' });
      if (error) throw error;
      accountOriginalEmail = newEmail;
      accountVerifyStatus.textContent = '';
      accountSection.style.display = 'none';
    } catch (err) {
      console.error('Verify email change failed:', (err && err.message) || String(err));
      accountVerifyStatus.textContent = t('bad_code') + ((err && err.message) || String(err));
      accountVerifyStatus.classList.add('error');
    } finally {
      accountVerifyBtn.disabled = false;
    }
  });

  // ===== מדריך שימוש =====
  document.getElementById('show-guide-btn').addEventListener('click', () => {
    showSection(guideSection);
  });
  document.getElementById('close-guide-btn').addEventListener('click', stopGuideNarration);

  // ===== הסבר קולי בעברית למדריך השימוש (הקלטות אמיתיות שלך - עברית טבעית ומדויקת) =====
  const GUIDE_AUDIO_FILES = [
    'guide-audio-recorded/step0.weba',
    'guide-audio-recorded/step1.weba',
    'guide-audio-recorded/step2.weba',
    'guide-audio-recorded/step3.weba',
    'guide-audio-recorded/step4.weba',
    'guide-audio-recorded/step5.weba',
    'guide-audio-recorded/step6.weba'
  ];

  let guideSpeaking = false;
  const guideAudioEl = new Audio();
  // הקלטה 0 (ברוכה הבאה) והקלטה 1 (הוספת צמח חדש) שייכות שתיהן לכרטיס הראשון ("הוספת צמח חדש"),
  // כי אין כרטיס נפרד לפתיחה - רק מהקלטה 2 ואילך יש התאמה ישירה של הקלטה לכרטיס.
  const GUIDE_CARD_FOR_AUDIO = [0, 0, 1, 2, 3, 4, 5];

  function highlightGuideStep(audioIndex) {
    const cardIndex = audioIndex >= 0 ? GUIDE_CARD_FOR_AUDIO[audioIndex] : -1;
    document.querySelectorAll('.guide-step').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.step) === cardIndex);
    });
    if (cardIndex >= 0) {
      const el = document.querySelector(`.guide-step[data-step="${cardIndex}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function stopGuideNarration() {
    guideAudioEl.pause();
    guideSpeaking = false;
    guideAudioIndex = -1;
    highlightGuideStep(-1);
    document.getElementById('guide-play-btn').style.display = 'inline-block';
    document.getElementById('guide-stop-btn').style.display = 'none';
    document.getElementById('guide-voice-status').textContent = '';
  }

  let guideAudioIndex = -1; // האינדקס של ההקלטה שמתנגנת כרגע (נשמר במשתנה, לא נקרא מה-DOM)

  function speakGuideStep(index) {
    if (index >= GUIDE_AUDIO_FILES.length) { stopGuideNarration(); return; }
    guideAudioIndex = index;
    highlightGuideStep(index);
    guideAudioEl.src = GUIDE_AUDIO_FILES[index];
    guideAudioEl.play().catch(() => { if (guideSpeaking) speakGuideStep(index + 1); });
  }
  guideAudioEl.addEventListener('ended', () => {
    if (guideSpeaking) speakGuideStep(guideAudioIndex + 1);
  });

  document.getElementById('guide-play-btn').addEventListener('click', () => {
    guideSpeaking = true;
    document.getElementById('guide-play-btn').style.display = 'none';
    document.getElementById('guide-stop-btn').style.display = 'inline-block';
    document.getElementById('guide-voice-status').textContent = '';
    speakGuideStep(0);
  });

  document.getElementById('guide-stop-btn').addEventListener('click', stopGuideNarration);

  // ===== ניהול מערכת (אדמין בלבד) =====
  // ההסתרה של הכפתור/הסקשן היא רק נוחות ממשק - ההגנה האמיתית היא ה-RLS policies
  // על plants/profiles שמאפשרות למנהלת (ADMIN_USER_ID) לראות/לערוך/למחוק כל שורה.
  let adminUserEmailById = {};

  // מנעול עריכה - כברירת מחדל נעול, כדי שעריכה/מחיקה בנתונים רגישים לא תקרה בטעות.
  // זו הגנת ממשק בלבד (לא הגנת אבטחה) - ה-RLS כבר מגן על מי בכלל יכול לגשת לנתונים.
  let adminUnlocked = false;

  function setAdminStatus(msg, isError) {
    const el = document.getElementById('admin-status');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('error', !!isError);
  }

  document.getElementById('admin-lock-toggle').addEventListener('click', () => {
    adminUnlocked = !adminUnlocked;
    const btn = document.getElementById('admin-lock-toggle');
    btn.classList.toggle('locked', !adminUnlocked);
    btn.classList.toggle('unlocked', adminUnlocked);
    btn.textContent = adminUnlocked ? '🔓 פתוח לעריכה - לחצי לנעילה' : '🔒 נעול לעריכה - לחצי לפתיחה';
    // מרעננים את התצוגה הנוכחית כדי שכפתורי שמירה/מחיקה יתעדכנו (מושבתים/פעילים)
    applyAdminUsersFilter();
    if (adminPlantsUserIdFilter) applyAdminPlantsFilter();
  });

  document.getElementById('show-admin-btn').addEventListener('click', () => {
    showSection(adminSection);
    document.getElementById('admin-plants-tab').style.display = 'none';
    document.getElementById('admin-users-tab').style.display = 'block';
    loadAdminUsers().then(loadAdminPlants);
  });
  document.getElementById('close-admin-btn').addEventListener('click', () => {
    adminSection.style.display = 'none';
  });

  document.getElementById('back-to-admin-users-btn').addEventListener('click', () => {
    document.getElementById('admin-plants-tab').style.display = 'none';
    document.getElementById('admin-users-tab').style.display = 'block';
  });

  // ===== חיפוש משתמשים - מסנן תוך כדי הקלדה (אות ראשונה, שנייה וכו') =====
  let adminPlantsCache = [];
  let adminUsersCache = [];
  let adminUserNameById = {};
  let adminPlantsUserIdFilter = null; // מזהה המשתמש שאת הצמחים שלו רואים כרגע (מגיעים תמיד דרך "הצמחים שלו/ה")

  // קופצים מרשימת המשתמשים לצמחים של משתמש ספציפי בלבד
  function jumpToUserPlants(userId, displayName) {
    adminPlantsUserIdFilter = userId;
    document.getElementById('admin-plants-owner-title').textContent = 'הצמחים של ' + displayName;
    document.getElementById('admin-users-tab').style.display = 'none';
    document.getElementById('admin-plants-tab').style.display = 'block';
    applyAdminPlantsFilter();
  }

  function applyAdminPlantsFilter() {
    if (!adminPlantsUserIdFilter) { renderAdminPlants([]); return; }
    renderAdminPlants(adminPlantsCache.filter(p => p.user_id === adminPlantsUserIdFilter));
  }

  function applyAdminUsersFilter() {
    const query = document.getElementById('admin-users-search').value.trim().toLowerCase();
    if (!query) { renderAdminUsers(adminUsersCache); return; }
    const filtered = adminUsersCache.filter(u => {
      const name = `${u.first_name || ''} ${u.last_name || ''}`.toLowerCase();
      const email = (u.email || '').toLowerCase();
      return name.includes(query) || email.includes(query);
    });
    renderAdminUsers(filtered);
  }

  document.getElementById('admin-users-search').addEventListener('input', applyAdminUsersFilter);

  async function loadAdminPlants() {
    try {
      const response = await fetch(SUPABASE_TABLE_URL + '?select=*&order=added_at.desc', {
        headers: await getSupabaseHeaders()
      });
      if (!response.ok) throw new Error('שגיאה בטעינת הצמחים (קוד ' + response.status + ')');
      adminPlantsCache = await response.json();
    } catch (err) {
      setAdminStatus('שגיאה: ' + ((err && err.message) || String(err)), true);
    }
  }

  function renderAdminPlants(rows) {
    const container = document.getElementById('admin-plants-list');
    container.innerHTML = '';
    if (!rows.length) {
      container.innerHTML = '<p class="sub">אין צמחים במערכת.</p>';
      return;
    }
    rows.forEach(p => {
      const row = document.createElement('div');
      row.className = 'admin-row';
      row.innerHTML = `
        ${p.photo_base64 ? `<img src="${p.photo_base64}" alt="">` : ''}
        <div class="admin-fields">
          <input type="text" data-field="name_he" value="${escapeHtml(p.name_he || '')}" placeholder="שם (עברית)">
          <input type="text" data-field="name_en" value="${escapeHtml(p.name_en || '')}" placeholder="שם (אנגלית)">
          <select data-field="source">
            <option value="mine" ${p.source === 'mine' ? 'selected' : ''}>הצמחים שלי</option>
            <option value="web" ${p.source === 'web' ? 'selected' : ''}>מהרשת</option>
          </select>
          <input type="number" data-field="watering_interval_days" value="${p.watering_interval_days ?? ''}" placeholder="מרווח השקיה (ימים)" style="width:90px;">
          <span class="sub" style="margin:0;">בעלים: ${escapeHtml(adminUserNameById[p.user_id] || '') || escapeHtml(adminUserEmailById[p.user_id] || p.user_id || '—')} ${adminUserNameById[p.user_id] ? '(' + escapeHtml(adminUserEmailById[p.user_id] || '') + ')' : ''}</span>
        </div>
        <div class="admin-actions">
          <button type="button" class="btn" data-action="save" ${adminUnlocked ? '' : 'disabled'}>💾 שמירה</button>
          <button type="button" class="btn btn-ghost" data-action="delete" ${adminUnlocked ? '' : 'disabled'}>🗑️ מחיקה</button>
        </div>
      `;
      row.querySelector('[data-action="save"]').addEventListener('click', async () => {
        if (!adminUnlocked) { setAdminStatus('🔒 יש לפתוח את המנעול לפני עריכה', true); return; }
        const intervalVal = row.querySelector('[data-field="watering_interval_days"]').value;
        const updates = {
          name_he: row.querySelector('[data-field="name_he"]').value.trim(),
          name_en: row.querySelector('[data-field="name_en"]').value.trim() || null,
          source: row.querySelector('[data-field="source"]').value,
          watering_interval_days: intervalVal ? Number(intervalVal) : null
        };
        try {
          const response = await fetch(SUPABASE_TABLE_URL + '?id=eq.' + encodeURIComponent(p.id), {
            method: 'PATCH',
            headers: { ...(await getSupabaseHeaders()), 'Prefer': 'return=minimal' },
            body: JSON.stringify(updates)
          });
          if (!response.ok) throw new Error('שמירה נכשלה (קוד ' + response.status + ')');
          setAdminStatus('✓ הצמח נשמר');
        } catch (err) {
          setAdminStatus('שגיאה בשמירה: ' + ((err && err.message) || String(err)), true);
        }
      });
      row.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        if (!adminUnlocked) { setAdminStatus('🔒 יש לפתוח את המנעול לפני מחיקה', true); return; }
        if (!confirm(`למחוק לצמיתות את הצמח "${p.name_he}"? הפעולה בלתי הפיכה.`)) return;
        try {
          const response = await fetch(SUPABASE_TABLE_URL + '?id=eq.' + encodeURIComponent(p.id), {
            method: 'DELETE',
            headers: await getSupabaseHeaders()
          });
          if (!response.ok) throw new Error('מחיקה נכשלה (קוד ' + response.status + ')');
          row.remove();
          setAdminStatus('✓ הצמח נמחק');
        } catch (err) {
          setAdminStatus('שגיאה במחיקה: ' + ((err && err.message) || String(err)), true);
        }
      });
      container.appendChild(row);
    });
  }

  async function loadAdminUsers() {
    setAdminStatus('טוענת משתמשים...');
    try {
      const response = await fetch(SUPABASE_PROFILES_URL + '?select=id,email,first_name,last_name,notify_watering&order=created_at', {
        headers: await getSupabaseHeaders()
      });
      if (!response.ok) throw new Error('שגיאה בטעינת המשתמשים (קוד ' + response.status + ')');
      const rows = await response.json();
      adminUsersCache = rows;
      adminUserEmailById = {};
      adminUserNameById = {};
      rows.forEach(u => {
        adminUserEmailById[u.id] = u.email;
        adminUserNameById[u.id] = `${u.first_name || ''} ${u.last_name || ''}`.trim();
      });
      applyAdminUsersFilter();
      setAdminStatus('');
    } catch (err) {
      setAdminStatus('שגיאה: ' + ((err && err.message) || String(err)), true);
    }
  }

  function renderAdminUsers(rows) {
    const container = document.getElementById('admin-users-list');
    container.innerHTML = '';
    if (!rows.length) {
      container.innerHTML = '<p class="sub">אין משתמשים.</p>';
      return;
    }
    rows.forEach(u => {
      const row = document.createElement('div');
      row.className = 'admin-row';
      row.innerHTML = `
        <div class="admin-fields">
          <span class="sub" style="margin:0;">${escapeHtml(u.email || '')}</span>
          <input type="text" data-field="first_name" value="${escapeHtml(u.first_name || '')}" placeholder="שם פרטי">
          <input type="text" data-field="last_name" value="${escapeHtml(u.last_name || '')}" placeholder="שם משפחה">
          <label><input type="checkbox" data-field="notify_watering" ${u.notify_watering !== false ? 'checked' : ''}> התראות השקיה</label>
        </div>
        <div class="admin-actions">
          <button type="button" class="btn btn-ghost" data-action="view-plants">🌿 הצמחים שלו/ה</button>
          <button type="button" class="btn" data-action="save" ${adminUnlocked ? '' : 'disabled'}>💾 שמירה</button>
          ${u.id === ADMIN_USER_ID ? '' : `<button type="button" class="btn btn-ghost" data-action="delete" ${adminUnlocked ? '' : 'disabled'}>🗑️ מחיקת פרופיל</button>`}
        </div>
      `;
      row.querySelector('[data-action="view-plants"]').addEventListener('click', () => {
        const displayName = `${u.first_name || ''} ${u.last_name || ''}`.trim() || u.email || '';
        jumpToUserPlants(u.id, displayName);
      });
      row.querySelector('[data-action="save"]').addEventListener('click', async () => {
        if (!adminUnlocked) { setAdminStatus('🔒 יש לפתוח את המנעול לפני עריכה', true); return; }
        const updates = {
          first_name: row.querySelector('[data-field="first_name"]').value.trim(),
          last_name: row.querySelector('[data-field="last_name"]').value.trim(),
          notify_watering: row.querySelector('[data-field="notify_watering"]').checked
        };
        try {
          const response = await fetch(SUPABASE_PROFILES_URL + '?id=eq.' + encodeURIComponent(u.id), {
            method: 'PATCH',
            headers: { ...(await getSupabaseHeaders()), 'Prefer': 'return=minimal' },
            body: JSON.stringify(updates)
          });
          if (!response.ok) throw new Error('שמירה נכשלה (קוד ' + response.status + ')');
          setAdminStatus('✓ המשתמש נשמר');
        } catch (err) {
          setAdminStatus('שגיאה בשמירה: ' + ((err && err.message) || String(err)), true);
        }
      });
      const delBtn = row.querySelector('[data-action="delete"]');
      if (delBtn) {
        delBtn.addEventListener('click', async () => {
          if (!adminUnlocked) { setAdminStatus('🔒 יש לפתוח את המנעול לפני מחיקה', true); return; }
          if (!confirm(`למחוק את שורת הפרופיל של ${u.email}? זה לא מוחק את חשבון ההתחברות שלו/ה - רק את הפרופיל (שם, העדפות).`)) return;
          try {
            const response = await fetch(SUPABASE_PROFILES_URL + '?id=eq.' + encodeURIComponent(u.id), {
              method: 'DELETE',
              headers: await getSupabaseHeaders()
            });
            if (!response.ok) throw new Error('מחיקה נכשלה (קוד ' + response.status + ')');
            row.remove();
            setAdminStatus('✓ הפרופיל נמחק');
          } catch (err) {
            setAdminStatus('שגיאה במחיקה: ' + ((err && err.message) || String(err)), true);
          }
        });
      }
      container.appendChild(row);
    });
  }
</script>

</body>
</html>
