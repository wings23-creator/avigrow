<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AviGrow — הצמחים שלי</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --bg: #F4F7EE;
    --ink: #1F3527;
    --ink-soft: #4A5F4E;
    --card: #FFFFFF;
    --line: #DCE5D3;
    --clay: #B5533C;
    --sprout: #7A9A1E;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
  }

  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 600; line-height: 1.15; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 0;
    position: -webkit-sticky; position: sticky; top: 0; z-index: 30;
    background: var(--bg);
  }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sprout); }
  header h1 { font-size: 1.4rem; flex: 1; }

  /* ===== כפתור המבורגר ===== */
  .menu-toggle {
    width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--card); cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; flex-shrink: 0;
  }
  .menu-toggle:hover { border-color: var(--sprout); }
  .menu-toggle span { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 1px; }

  /* ===== תפריט המבורגר - מגירה נגררת ===== */
  .menu-overlay {
    position: fixed; inset: 0; background: rgba(31, 53, 39, 0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40;
  }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-drawer {
    position: fixed; top: 0; inset-inline-end: 0; height: 100%; width: min(300px, 84vw);
    background: var(--card); z-index: 50; box-shadow: -8px 0 24px rgba(31, 53, 39, 0.15);
    transform: translateX(100%); transition: transform 0.25s ease; overflow-y: auto;
    padding: 20px; box-sizing: border-box;
  }
  [dir="rtl"] .menu-drawer { transform: translateX(-100%); }
  .menu-drawer.open { transform: translateX(0); }
  .menu-drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem;
  }
  .menu-close {
    background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--ink-soft);
    width: 32px; height: 32px; border-radius: 8px;
  }
  .menu-close:hover { background: var(--bg); }
  .menu-group { margin-bottom: 22px; }
  .menu-group-title {
    font-size: 0.78rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 8px; padding-inline-start: 4px;
  }
  .menu-item {
    display: block; width: 100%; text-align: start; padding: 12px 14px; margin-bottom: 6px;
    border-radius: 10px; border: none; background: var(--bg); color: var(--ink);
    font-size: 0.95rem; cursor: pointer; font-family: 'Inter', sans-serif; box-sizing: border-box;
  }
  .menu-item:hover { background: var(--sprout); color: #fff; }

  .page-intro { color: var(--ink-soft); margin-bottom: 36px; font-size: 1rem; }

  /* ===== עמוד נחיתה ===== */
  .hero {
    text-align: center; padding: 20px 0 40px;
  }
  .hero h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); margin-bottom: 10px; }
  .hero p { color: var(--ink-soft); max-width: 420px; margin: 0 auto 26px; }
  .stat-line { color: var(--ink-soft); font-size: 0.9rem; }
  .stat-line strong { color: var(--sprout); }

  /* ===== אריחי פעולות מהירות בדף הבית ===== */
  .quick-tiles {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    max-width: 420px; margin: 30px auto 0; text-align: center;
  }
  .quick-tile {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 10px; cursor: pointer; font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: border-color 0.15s ease;
  }
  .quick-tile:hover { border-color: var(--sprout); }
  .quick-tile .ic { font-size: 1.6rem; }
  .quick-tile .tt { font-size: 0.85rem; color: var(--ink); }

  /* ===== כרטיס "להשקות היום" בדף הבית ===== */
  .watering-focus-card {
    max-width: 420px; margin: 16px auto 0; background: var(--card);
    border-radius: var(--radius); border: 1px solid var(--line);
    border-inline-end: 3px solid var(--clay);
    padding: 16px; text-align: start;
  }
  .watering-focus-card .focus-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; }
  .watering-focus-card .focus-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 0.85rem; color: var(--ink-soft); padding: 6px 0; border-top: 1px solid var(--line);
  }
  .watering-focus-card .focus-row:first-child { border-top: none; }
  .watering-focus-card .btn { width: 100%; margin-top: 14px; }

  /* ===== תגית "מציגה רק צמחים שדורשים השקיה" ברשימה ===== */
  .filter-pill {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #FBEAE6; color: #8A3D26; font-size: 0.82rem;
    padding: 8px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  .filter-pill button {
    background: none; border: none; color: var(--clay); font-weight: 600;
    cursor: pointer; font-size: 0.82rem; font-family: 'Inter', sans-serif; padding: 0;
  }

  /* ===== בדיקת בריאות מהירה (בלי צמח קיים) ===== */
  .quick-health {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px; margin-bottom: 32px;
  }
  .quick-health h2 { font-size: 1.3rem; margin-bottom: 6px; }
  .quick-health .sub { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 18px; }
  .quick-health-result-box {
    margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 0.9rem;
    background: #EEF3E4; border: 1px solid var(--sprout);
  }
  .quick-health-result-box.warn { background: #FBEDE9; border-color: var(--clay); }
  .close-section-btn {
    background: none; border: none; color: var(--ink-soft); font-size: 0.85rem;
    cursor: pointer; padding: 0; margin-top: 14px; text-decoration: underline;
  }

  /* ===== חיפוש ===== */
  .search-section { margin-bottom: 20px; }
  .search-input {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px;
    font-family: 'Inter', sans-serif; font-size: 0.95rem; background: var(--card); color: var(--ink);
    margin-bottom: 12px;
  }
  .search-input:focus { outline: 2px solid var(--sprout); outline-offset: 1px; }
  .source-filter { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size: 0.82rem; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .filter-btn:hover { border-color: var(--sprout); color: var(--sprout); }
  .filter-btn.active { background: var(--sprout); border-color: var(--sprout); color: #fff; }

  /* ===== חיפוש צמח באינטרנט ===== */
  .web-search, .account-settings {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px; margin-bottom: 32px;
  }
  .guide-step { border-radius: 10px; padding: 10px; margin: 0 -10px 12px; transition: background 0.2s ease; }
  .guide-step.active { background: #EEF3E4; }
  .guide-step.active label { color: var(--sprout); }
  .web-search h2 { font-size: 1.3rem; margin-bottom: 6px; }
  .web-search .sub { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 18px; }
  .web-search-results {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px;
    margin-top: 16px;
  }
  .web-result-card {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg);
  }
  .web-result-card img { width: 100%; height: 120px; object-fit: cover; display: block; background: var(--line); }
  .web-result-card .wr-body { padding: 10px; }
  .web-result-card h4 { font-size: 0.9rem; margin-bottom: 4px; }
  .web-result-card p { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 8px; max-height: 3em; overflow: hidden; }
  .web-result-card button {
    width: 100%; padding: 6px; border-radius: 8px; border: none; background: var(--sprout);
    color: #fff; font-size: 0.82rem; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .web-result-card button:disabled { opacity: 0.6; cursor: default; }
  .source-badge {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px;
    background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line); margin-inline-start: 6px;
  }

  /* ===== טופס הוספת צמח ===== */
  .add-plant {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px; margin-bottom: 48px;
  }
  .add-plant h2 { font-size: 1.3rem; margin-bottom: 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.88rem; font-weight: 500; margin-bottom: 6px; color: var(--ink-soft); }
  .field input[type="text"], .field textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 0.95rem; background: var(--bg); color: var(--ink);
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--sprout); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* כפתור צילום תמונה - מוסתר את קלט הקובץ המקורי ומעצבים תווית יפה במקומו */
  .photo-input { display: none; }
  .photo-label {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 20px;
    cursor: pointer; color: var(--ink-soft); font-size: 0.9rem; text-align: center;
  }
  .photo-label:hover { border-color: var(--sprout); color: var(--sprout); }
  .photo-preview { max-width: 140px; border-radius: 10px; margin-top: 10px; display: none; }
  .identify-status { font-size: 0.85rem; color: var(--sprout); margin-top: 8px; min-height: 1.2em; }
  .identify-status.error { color: var(--clay); }

  .btn {
    display: inline-block; padding: 13px 28px; border-radius: 999px;
    font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer;
    background: var(--clay); color: #fff; font-family: 'Inter', sans-serif;
  }
  .btn:hover { opacity: 0.92; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  /* כפתור משני (ביטול/סגירה/עצירה) - אותה צורה וגודל כמו הכפתור הראשי, רק "ריק" מבפנים */
  .btn-ghost {
    background: none; border: 1.5px solid var(--line); color: var(--ink-soft);
  }
  .btn-ghost:hover { opacity: 1; background: var(--bg); }

  /* ===== רשימת הצמחים ===== */
  .plants-section h2 { font-size: 1.3rem; margin-bottom: 18px; }
  .app-footer {
    text-align: center; color: var(--ink-soft); font-size: 0.8rem;
    padding: 24px 0 12px; opacity: 0.75;
  }
  .empty-state {
    text-align: center; color: var(--ink-soft); padding: 40px 20px;
    border: 1.5px dashed var(--line); border-radius: var(--radius); font-size: 0.95rem;
  }
  .plants-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
    margin-bottom: 60px;
  }
  .plant-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden;
  }
  .plant-card img { width: 100%; height: 160px; object-fit: cover; display: block; background: var(--line); }
  .plant-card .body { padding: 16px; }
  .plant-card h3 { font-size: 1.05rem; }
  .plant-card .en-name { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 8px; }
  .plant-card .notes { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 10px; }
  .plant-card .date { font-size: 0.75rem; color: var(--ink-soft); opacity: 0.8; }
  /* ===== הוספה/החלפה של תמונת צמח קיים =====
     צמח שנוסף בלי תמונה היה תקוע בלעדיה - אפשר היה רק למחוק ולהוסיף מחדש. */
  .photo-slot { position: relative; }
  .card-photo-input { display: none; }
  .photo-empty {
    height: 160px; display: flex; align-items: center; justify-content: center;
    background: var(--bg); font-size: 2.4rem; border-bottom: 1px dashed var(--line);
  }
  .photo-edit-btn {
    position: absolute; inset-inline-end: 8px; bottom: 8px;
    background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; font-size: 0.78rem;
    cursor: pointer; color: var(--ink); font-family: 'Inter', sans-serif;
  }
  .photo-edit-btn:hover { border-color: var(--sprout); color: var(--sprout); }
  .photo-edit-btn:focus-visible { outline: 2px solid var(--sprout); outline-offset: 2px; }
  .photo-status { font-size: 0.78rem; color: var(--sprout); margin: 6px 14px 0; }
  .photo-status.error { color: var(--clay); }

  /* ===== תנאי גידול - חלון מידע לכל צמח ===== */
  .care-btn {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 0.8rem; cursor: pointer; color: var(--ink);
    font-family: 'Inter', sans-serif; margin-top: 10px;
  }
  .care-btn:hover { border-color: var(--sprout); color: var(--sprout); }
  .care-btn:focus-visible { outline: 2px solid var(--sprout); outline-offset: 2px; }
  .care-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .care-overlay {
    position: fixed; inset: 0; background: rgba(31, 53, 39, 0.45); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .care-overlay.open { display: flex; }
  .care-sheet {
    background: var(--card); border-radius: var(--radius); width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; padding: 22px; box-sizing: border-box;
    box-shadow: 0 18px 48px rgba(31, 53, 39, 0.28);
  }
  .care-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .care-head h3 { font-family: 'Fraunces', serif; font-size: 1.15rem; line-height: 1.35; }
  .care-latin { color: var(--ink-soft); font-size: 0.85rem; font-style: italic; margin-bottom: 14px; }
  .care-season-now {
    display: inline-block; background: #EAF3DE; color: #3B6D11; border: 1px solid var(--sprout);
    border-radius: 999px; padding: 4px 12px; font-size: 0.78rem; margin-bottom: 6px;
  }
  .care-block { border-top: 1px solid var(--line); padding: 14px 0; }
  .care-block h4 {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .care-block p { font-size: 0.9rem; line-height: 1.65; }
  .care-freq-wrap { border-top: 1px solid var(--line); padding-top: 14px; }
  .care-freq-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); margin-bottom: 8px;
  }
  .care-freq { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .care-freq div {
    text-align: center; padding: 8px 4px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg);
  }
  .care-freq div.now { border-color: var(--sprout); background: #EAF3DE; }
  .care-freq .fs { display: block; font-size: 0.72rem; color: var(--ink-soft); }
  .care-freq .fd { display: block; font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .care-current { font-size: 0.82rem; color: var(--ink-soft); margin-top: 10px; }
  .care-warn {
    background: #FBEDE9; border: 1px solid #E6C4B8; border-radius: 12px;
    padding: 12px 14px; margin-top: 16px;
  }
  .care-warn h4 {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: #8A3D26; margin-bottom: 8px;
  }
  .care-warn li { font-size: 0.85rem; line-height: 1.6; margin-inline-start: 18px; margin-bottom: 6px; }
  .care-warn li:last-child { margin-bottom: 0; }
  .care-unknown {
    background: var(--bg); border: 1px dashed var(--line); border-radius: 12px;
    padding: 14px; font-size: 0.88rem; line-height: 1.65; color: var(--ink-soft);
  }

  .plant-card .delete-btn {
    background: none; border: none; color: var(--clay); font-size: 0.8rem;
    cursor: pointer; margin-top: 8px; padding: 0; font-family: 'Inter', sans-serif;
  }

  /* ===== ניהול השקיה ===== */
  .watering-box { margin: 10px 0; padding: 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .watering-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .watering-row label { font-size: 0.82rem; }
  .watering-row input[type="number"] {
    width: 56px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    font-family: 'Inter', sans-serif; font-size: 0.85rem; text-align: center;
  }
  .watering-save-btn { padding: 6px 14px; font-size: 0.8rem; }
  .watering-status { font-size: 0.85rem; margin-top: 8px; font-weight: 600; }
  .watering-status.ok { color: var(--sprout); }
  .watering-status.due { color: #B8860B; }
  .watering-status.overdue { color: var(--clay); }
  .watering-done-btn { margin-top: 8px; padding: 7px 16px; font-size: 0.82rem; }

  /* ===== ניהול מערכת (אדמין) ===== */
  .admin-lock {
    display: block; width: 100%; text-align: center; padding: 10px; margin-bottom: 14px;
    border-radius: var(--radius); border: 1.5px solid var(--line); cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
  }
  .admin-lock.locked { background: #FBEAE6; color: #8A3D26; border-color: #E6C4B8; }
  .admin-lock.unlocked { background: #EAF3DE; color: #3B6D11; border-color: var(--sprout); }
  /* כשנעול - כפתורי שמירה/מחיקה מושבתים ויזואלית, גם אם ה-disabled attribute כבר חוסם אותם */
  .admin-row .admin-actions button[disabled] { opacity: 0.4; cursor: not-allowed; }
  .admin-table { display: flex; flex-direction: column; gap: 10px; }
  .admin-row {
    display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;
    padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  .admin-row img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .admin-row .admin-fields { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; min-width: 220px; align-items: center; }
  .admin-row .admin-fields input[type="text"],
  .admin-row .admin-fields input[type="number"],
  .admin-row .admin-fields select {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    font-family: 'Inter', sans-serif; font-size: 0.82rem;
  }
  .admin-row .admin-fields label { font-size: 0.82rem; display: flex; align-items: center; gap: 4px; }
  .admin-row .admin-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .admin-row .admin-actions .btn, .admin-row .admin-actions .btn-ghost { padding: 7px 12px; font-size: 0.8rem; }

  /* בדיקת בריאות בכרטיס צמח */
  .health-input { display: none; }
  .health-btn {
    display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); font-size: 0.82rem; cursor: pointer; color: var(--ink-soft);
  }
  .health-btn:hover { border-color: var(--sprout); color: var(--sprout); }
  .health-status-msg { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; }
  .health-result {
    margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 0.83rem;
    background: #EEF3E4; border: 1px solid var(--sprout);
  }
  .health-result.warn { background: #FBEDE9; border-color: var(--clay); }
  .health-result .h-status { font-weight: 600; margin-bottom: 4px; display: block; }
  .health-result .h-date { font-size: 0.72rem; color: var(--ink-soft); margin-top: 6px; display: block; }

  /* מצב טעינה כללי */
  .loading-state { text-align: center; color: var(--ink-soft); padding: 40px 20px; font-size: 0.95rem; }

  @media (max-width: 560px) {
    .row2 { grid-template-columns: 1fr; }
  }

  a:focus-visible, .btn:focus-visible, .photo-label:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }

  /* ===== שער כניסה - אימות משתמש באימייל ===== */
  .auth-gate {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 32px 28px; max-width: 380px; width: 100%; text-align: center;
  }
  .auth-card .logo-dot { display: inline-block; margin-bottom: 8px; }
  .auth-card h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; margin-bottom: 6px; }
  .auth-card .sub { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 22px; }
  .auth-card .field { text-align: start; margin-bottom: 14px; }
  .auth-card .field label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--ink-soft); }
  .auth-card .field input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 0.95rem; background: var(--bg); color: var(--ink); box-sizing: border-box;
  }
  .auth-card .field input:focus { outline: 2px solid var(--sprout); outline-offset: 1px; }
  .auth-card .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .auth-card .btn { width: 100%; margin-top: 6px; }
  .auth-status { font-size: 0.85rem; color: var(--sprout); margin-top: 14px; min-height: 1.2em; }
  .auth-status.error { color: var(--clay); }
  .auth-sent-icon { font-size: 2.4rem; margin-bottom: 10px; }
  /* ===== בורר שפה עם דגלים =====
     הדגלים הם SVG מוטבע ולא אמוג'י דגל: כרום ואדג' ב-Windows לא מציגים אמוג'י
     דגלים בכלל אלא את קוד המדינה באותיות (IL/GB/RU), וזה נראה שבור. */
  .lang-picker { position: relative; flex-shrink: 0; }
  .lang-btn {
    display: flex; align-items: center; gap: 5px; height: 40px; padding: 0 8px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--sprout); }
  .lang-btn:focus-visible { outline: 2px solid var(--sprout); outline-offset: 1px; }
  .lang-flag {
    width: 24px; height: 17px; border-radius: 3px; overflow: hidden; display: block;
    box-shadow: inset 0 0 0 1px rgba(31, 53, 39, .18);
  }
  .lang-flag svg { display: block; width: 100%; height: 100%; }
  .lang-caret { font-size: 0.62rem; color: var(--ink-soft); line-height: 1; }

  .lang-menu {
    position: absolute; top: calc(100% + 6px); inset-inline-end: 0; min-width: 158px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 26px rgba(31, 53, 39, .18); padding: 5px; display: none; z-index: 40;
  }
  .lang-menu.open { display: block; }
  .lang-option {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border: none; border-radius: 8px; background: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--ink); text-align: start;
  }
  .lang-option:hover { background: var(--bg); }
  .lang-option[aria-selected="true"] { background: var(--bg); font-weight: 500; }
  .lang-option .lang-check { margin-inline-start: auto; color: var(--sprout); }

  .lang-picker-gate { position: absolute; top: 12px; inset-inline-end: 12px; }
  .lang-picker-gate .lang-btn { height: 34px; }
  .auth-card { position: relative; }

  .auth-change-email { background: none; border: none; color: var(--ink-soft); font-size: 0.82rem; text-decoration: underline; cursor: pointer; margin-top: 14px; }

  /* ===== סיור מודרך - אצבע שמצביעה על הפעולה הבאה בכל מסך, בכניסה הראשונה =====
     כל השכבה היא pointer-events:none חוץ מכפתורי הבועה עצמה, כדי שהמשתמש
     יוכל ללחוץ בפועל על האלמנט שמסומן ולהמשיך הלאה בצורה טבעית. */
  .coach-layer { position: fixed; inset: 0; z-index: 120; pointer-events: none; display: none; }
  .coach-layer.on { display: block; }

  /* טבעת ההדגשה - ה-box-shadow הענק מכהה את כל שאר המסך ומשאיר "חלון" על היעד */
  .coach-ring {
    position: fixed; border-radius: 14px; pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(31, 53, 39, 0.55);
    outline: 3px solid var(--sprout); outline-offset: 2px;
  }

  .coach-finger {
    position: fixed; font-size: 2.1rem; pointer-events: none;
    line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35));
    animation: coach-bounce 1.1s ease-in-out infinite;
  }
  @keyframes coach-bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }
  @media (prefers-reduced-motion: reduce) { .coach-finger { animation: none; } }

  .coach-bubble {
    position: fixed; pointer-events: auto; box-sizing: border-box;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; max-width: 290px;
    box-shadow: 0 10px 30px rgba(31, 53, 39, .28);
    font-size: 0.9rem; line-height: 1.5; text-align: start;
  }
  .coach-bubble .coach-text { margin: 0 0 12px; }
  .coach-bubble .coach-count {
    display: block; font-size: 0.72rem; color: var(--ink-soft);
    margin-bottom: 6px; letter-spacing: .04em;
  }
  .coach-actions { display: flex; align-items: center; gap: 10px; }
  .coach-actions .coach-next {
    background: var(--sprout); color: #fff; border: none; border-radius: 999px;
    padding: 7px 18px; font-family: 'Inter', sans-serif; font-size: 0.85rem; cursor: pointer;
  }
  .coach-actions .coach-skip {
    background: none; border: none; color: var(--ink-soft);
    font-size: 0.8rem; text-decoration: underline; cursor: pointer;
    font-family: 'Inter', sans-serif; margin-inline-start: auto;
  }
  .coach-actions .coach-hint { font-size: 0.8rem; color: var(--sprout); font-weight: 500; }

  /* מסך נמוך (נייד לרוחב / חלון קטן) - בועה קומפקטית, כדי שתישאר מקום להצביע */
  @media (max-height: 520px) {
    .coach-bubble { padding: 10px 12px; max-width: 240px; font-size: 0.82rem; }
    .coach-bubble .coach-text { margin-bottom: 8px; }
    .coach-bubble .coach-count { display: none; }
    .coach-finger { font-size: 1.7rem; }
  }
</style>
</head>
<body>

  <!-- שער כניסה - מוצג עד שהמשתמש מאומת -->

  // ברירת המחדל היא עברית בכוונה: רוב המשתמשות הקיימות עובדות בעברית גם כשהדפדפן
  // מוגדר באנגלית, ולא נכון להחליף להן שפה מאחורי הגב. השפה משתנה רק בבחירה מפורשת.
  let currentLang = 'he';
  try {
    const saved = localStorage.getItem('avigrow_lang');
    if (saved && LANGS[saved]) currentLang = saved;
  } catch (e) { /* אחסון חסום - נשארים בעברית */ }

  // t('key', {n: 3}) - מחזיר את הטקסט בשפה הנוכחית, עם החלפת {משתנים}
  function t(key, vars) {
    const table = I18N[currentLang] || I18N.he;
    let str = (table[key] !== undefined) ? table[key] : (I18N.he[key] !== undefined ? I18N.he[key] : key);
    if (vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
    return str;
  }

  // צורת יחיד/רבים של "יום" - ברוסית יש גם צורת ביניים (2-4 ימים)
  function daysUnit(n) {
    n = Math.abs(n);
    if (currentLang === 'ru') {
      const t1 = n % 10, t2 = n % 100;
      if (t1 === 1 && t2 !== 11) return 'день';
      if (t1 >= 2 && t1 <= 4 && (t2 < 10 || t2 >= 20)) return 'дня';
      return 'дней';
    }
    return n === 1 ? t('day') : t('days');
  }

  // דגלים כ-SVG מוטבע, כדי שייראו זהה בכל דפדפן ומערכת הפעלה
  const FLAGS = {
    he: '<svg viewBox="0 0 32 22" aria-hidden="true"><rect width="32" height="22" fill="#fff"/>' +
        '<rect y="2.6" width="32" height="2.8" fill="#0038b8"/><rect y="16.6" width="32" height="2.8" fill="#0038b8"/>' +
        '<path d="M16 7.1 L19.2 12.6 H12.8 Z M16 14.9 L12.8 9.4 H19.2 Z" fill="none" stroke="#0038b8" stroke-width="1.05"/></svg>',
    en: '<svg viewBox="0 0 32 22" aria-hidden="true"><rect width="32" height="22" fill="#012169"/>' +
        '<path d="M0,0 L32,22 M32,0 L0,22" stroke="#fff" stroke-width="4.4"/>' +
        '<path d="M0,0 L32,22 M32,0 L0,22" stroke="#C8102E" stroke-width="2"/>' +
        '<path d="M16,0 V22 M0,11 H32" stroke="#fff" stroke-width="7.3"/>' +
        '<path d="M16,0 V22 M0,11 H32" stroke="#C8102E" stroke-width="4.4"/></svg>',
    ru: '<svg viewBox="0 0 32 22" aria-hidden="true"><rect width="32" height="22" fill="#fff"/>' +
        '<rect y="7.34" width="32" height="7.33" fill="#0039A6"/><rect y="14.67" width="32" height="7.33" fill="#D52B1E"/></svg>'
  };

  function closeAllLangMenus(except) {
    document.querySelectorAll('[data-lang-picker]').forEach(p => {
      if (p === except) return;
      p.querySelector('.lang-menu').classList.remove('open');
      p.querySelector('.lang-btn').setAttribute('aria-expanded', 'false');
    });
  }

  // מצייר מחדש את הדגל שעל הכפתור ואת רשימת האפשרויות, לפי השפה הנוכחית
  function renderLangPicker(picker) {
    picker.querySelector('.lang-flag').innerHTML = FLAGS[currentLang];
    picker.querySelector('.lang-btn').setAttribute('aria-label', LANG_NAMES[currentLang]);
    const menu = picker.querySelector('.lang-menu');
    menu.innerHTML = Object.keys(LANGS).map(code =>
      '<button type="button" class="lang-option" role="option" data-lang="' + code + '"' +
      ' aria-selected="' + (code === currentLang) + '">' +
      '<span class="lang-flag">' + FLAGS[code] + '</span>' +
      '<span>' + LANG_NAMES[code] + '</span>' +
      (code === currentLang ? '<span class="lang-check">✓</span>' : '') +
      '</button>'
    ).join('');
    menu.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', () => {
        closeAllLangMenus();
        applyLanguage(opt.dataset.lang);
      });
    });
  }

  function initLangPicker(picker) {
    const btn = picker.querySelector('.lang-btn');
    const menu = picker.querySelector('.lang-menu');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const willOpen = !menu.classList.contains('open');
      closeAllLangMenus(picker);
      menu.classList.toggle('open', willOpen);
      btn.setAttribute('aria-expanded', String(willOpen));
    });
    menu.addEventListener('click', (e) => e.stopPropagation());
    renderLangPicker(picker);
  }

  document.addEventListener('click', () => closeAllLangMenus());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllLangMenus(); });

  function applyLanguage(lang) {
    if (!LANGS[lang]) lang = 'he';
    currentLang = lang;
    try { localStorage.setItem('avigrow_lang', lang); } catch (e) { /* אחסון חסום */ }

    document.documentElement.lang = lang;
    document.documentElement.dir = LANGS[lang].dir;
    document.title = t('doc_title');

    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.dataset.i18nTitle)); });

    document.querySelectorAll('[data-lang-picker]').forEach(renderLangPicker);

    // תוכן דינמי שנבנה ב-JS צריך להיבנות מחדש בשפה החדשה.
    // הגישה נעשית דרך ה-DOM ובתוך try, כי חלק מהמשתנים מוגדרים בהמשך הסקריפט
    // (const/let) ופנייה אליהם מוקדם מדי זורקת שגיאת TDZ.
    try {
      const lbl = document.getElementById('photo-label');
      const prev = document.getElementById('photo-preview');
      if (lbl) lbl.textContent = (prev && prev.style.display === 'block') ? t('photo_change') : t('photo_pick');
      const appWrap = document.getElementById('app-wrap');
      if (appWrap && appWrap.style.display !== 'none') renderPlants();
      if (coachSteps) showCoachStep();
    } catch (e) { /* ריענון תוכן דינמי לא קריטי - השפה כבר הוחלפה */ }
  }
  // ===== חיבור ל-Supabase =====
  // Project URL וה-anon public key נלקחים מ-Project Settings → API בפרויקט ה-Supabase שלך.
  // ה-anon key הזה מיועד להיות גלוי בצד לקוח (הוא ממילא רץ בדפדפן) - ההגנה האמיתית
  // היא ה-Row Level Security policy שהוגדרה על טבלת plants.
  const SUPABASE_URL = 'https://wipkpkdctwnpsyqszzhn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_IYt_DMG8DzuLoxUVtqWCbw_X1LRC6_O';

  const SUPABASE_TABLE_URL = SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/plants';
  const SUPABASE_PROFILES_URL = SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/profiles';
  const PLANT_AI_URL = SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/plant-ai';

  // מזהה המשתמשת שהיא מנהלת המערכת - זה רק לצורך הצגה/הסתרה של תפריט הניהול בממשק.
  // ההרשאה האמיתית נאכפת ב-Row Level Security policies על טבלאות plants/profiles ב-Supabase.
  const ADMIN_USER_ID = '31f1b6b6-eb61-4f94-9b44-e84659f83400';

  // לקוח Supabase Auth (ניהול משתמשים, אימות באימייל, session)
  const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // כותרות בקשה ל-REST/Functions - ה-Authorization חייב להיות ה-access token האישי
  // של המשתמש המחובר (לא רק ה-anon key), כדי שה-RLS ידע לזהות auth.uid() ולסנן לפי משתמש
  async function getSupabaseHeaders() {
    const { data } = await sbClient.auth.getSession();
    const token = (data.session && data.session.access_token) || SUPABASE_ANON_KEY;
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };
  }

  // ===== קריאה לזיהוי/בדיקת בריאות דרך ה-Edge Function =====
  // מפתח ה-Anthropic API עצמו יושב רק בצד השרת (Supabase Function Secrets),
  // לא בקוד הדף - כך שהוא לא נחשף לכל מי שפותח "הצג מקור" בדפדפן.
  async function callPlantAI(system, mediaType, base64Data, userText) {
    assertSupabaseConfigured();
    const response = await fetch(PLANT_AI_URL, {
      method: 'POST',
      headers: await getSupabaseHeaders(),
      body: JSON.stringify({ system, mediaType, base64Data, userText })
    });
    if (!response.ok) throw new Error('שגיאת שרת ה-AI (קוד ' + response.status + ')');
    return response.json();
  }

  function assertSupabaseConfigured() {
    if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_SUPABASE_URL_HERE') ||
        !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY_HERE')) {
      throw new Error('החיבור ל-Supabase לא הוגדר עדיין - חסרים SUPABASE_URL / SUPABASE_ANON_KEY בקוד הדף');
    }
  }

  // ===== המרה בין מבנה השורה בטבלה (snake_case) למבנה שהדף עובד איתו (camelCase) =====
  function rowToPlant(row) {
    const plant = {
      id: row.id,
      nameHe: row.name_he,
      nameEn: row.name_en,
      notes: row.notes,
      photo: row.photo_base64,
      source: row.source || 'mine',
      addedAt: row.added_at ? new Date(row.added_at).toLocaleDateString('he-IL') : '',
      wateringIntervalDays: row.watering_interval_days || null,
      lastWateredAt: row.last_watered_at || null
    };
    if (row.health_status) {
      plant.health = {
        status: row.health_status,
        diagnosis: row.health_diagnosis,
        advice: row.health_advice,
        date: row.health_date ? new Date(row.health_date).toLocaleDateString('he-IL') : ''
      };
    }
    return plant;
  }

  function plantToInsertRow(plant) {
    return {
      name_he: plant.nameHe,
      name_en: plant.nameEn || null,
      notes: plant.notes || null,
      photo_base64: plant.photo || null,
      source: plant.source === 'web' ? 'web' : 'mine',
      user_id: currentUserId
    };
  }

  // ===== תפיסת שגיאות גלובלית =====
  // אם משהו נכשל בצורה לא צפויה בכל מקום בדף, נציג את הטקסט המדויק
  // כדי שיהיה אפשר לדעת בדיוק מה קרה (במקום "Script error" בלי פרטים)
  function showGlobalError(message) {
    const el = document.getElementById('save-error');
    if (!el) return;
    el.textContent = t('error') + message;
    el.style.display = 'block';
  }
  window.addEventListener('error', (e) => {
    const msg = (e.error && e.error.message) || e.message || t('unknown_error');
    console.error('Uncaught error:', msg);
    showGlobalError(msg);
  });
  window.addEventListener('unhandledrejection', (e) => {
    const msg = (e.reason && e.reason.message) || String(e.reason);
    console.error('Unhandled promise rejection:', msg);
    showGlobalError(msg);
  });

  // ===== ייצוא וייבוא נתונים =====
  // מאפשר לגבות את כל רשימת הצמחים (כולל תמונות) לקובץ מקומי.
  const importStatus = document.getElementById('import-status');

  async function exportPlantsToFile(silent) {
    const plants = await loadPlants();
    if (plants.length === 0) {
      if (!silent) {
        importStatus.textContent = t('import_none');
        importStatus.style.display = 'block';
        importStatus.classList.remove('error');
      }
      return;
    }
    const dataStr = JSON.stringify(plants, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // שם קובץ עם תאריך ושעה - כדי שכל גיבוי אוטומטי יהיה קובץ נפרד ומזוהה
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.download = 'avigrow-plants-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    if (silent) {
      // רמז עדין שגיבוי אוטומטי קרה, בלי להפריע לזרימה
      importStatus.textContent = t('exporting');
      importStatus.classList.remove('error');
      importStatus.style.display = 'block';
    }
  }

  document.getElementById('export-btn').addEventListener('click', () => exportPlantsToFile(false));

  document.getElementById('import-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    importStatus.style.display = 'block';
    importStatus.classList.remove('error');
    importStatus.textContent = t('importing');

    try {
      assertSupabaseConfigured();
      const text = await file.text();
      const imported = JSON.parse(text);
      if (!Array.isArray(imported)) throw new Error('מבנה הקובץ לא תקין - לא נמצאה רשימת צמחים');

      const rows = imported.map(p => plantToInsertRow(p));
      const response = await fetch(SUPABASE_TABLE_URL, {
        method: 'POST',
        headers: { ...(await getSupabaseHeaders()), 'Prefer': 'return=minimal' },
        body: JSON.stringify(rows)
      });
      if (!response.ok) throw new Error('שגיאת שרת בייבוא (קוד ' + response.status + ')');

      await renderPlants();
      importStatus.textContent = t('import_ok', { n: imported.length });
    } catch (err) {
      console.error('Import failed:', (err && err.message) || String(err));
      importStatus.textContent = t('import_failed') + ((err && err.message) || String(err));
      importStatus.classList.add('error');
    }

    e.target.value = ''; // מאפשר לייבא שוב את אותו קובץ אם צריך
  });

  // ===== תפריט המבורגר =====
  const menuOverlay = document.getElementById('menu-overlay');
  const menuDrawer = document.getElementById('menu-drawer');

  function openMenu() {
    menuOverlay.classList.add('open');
    menuDrawer.classList.add('open');
    menuDrawer.setAttribute('aria-hidden', 'false');
  }
  function closeMenu() {
    menuOverlay.classList.remove('open');
    menuDrawer.classList.remove('open');
    menuDrawer.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('menu-toggle-btn').addEventListener('click', openMenu);
  document.getElementById('menu-close-btn').addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
  // סגירת התפריט אוטומטית בבחירת כל פריט (כולל תווית הייבוא, שאינה כפתור)
  menuDrawer.querySelectorAll('.menu-item').forEach(item => item.addEventListener('click', closeMenu));

  // ===== סיור מודרך - אצבע שמצביעה על הפעולה הבאה =====
  // בכניסה הראשונה לכל מסך, אצבע מצביעה על מה לעשות קודם. הסיור לא חוסם כלום:
  // שכבת ההדגשה כולה pointer-events:none, כך שהמשתמש לוחץ בפועל על האלמנט
  // המסומן - והסיור מתקדם מעצמו לצעד הבא. כל סיור מוצג פעם אחת בלבד למשתמש.
  //
  // step.watch = על איזה אירוע להתקדם. ברירת המחדל: לחיצה על היעד עצמו.
  // step.info  = צעד הסברה בלבד, מתקדמים בכפתור "הבא" (וגם בלחיצה על היעד).
  const TOURS = {
    home: [
      { sel: '#tile-add-plant',   info: true, key: 'tour_home1' },
      { sel: '#tile-plants-list', info: true, key: 'tour_home2' },
      { sel: '#menu-toggle-btn',  info: true, key: 'tour_home3' }
    ],
    add: [
      { sel: '#photo-label', watch: { sel: '#photo-input', ev: 'change' },
        hint: 'btn', key: 'tour_add1' },
      { sel: '#plant-form button[type="submit"]',
        hint: 'btn', key: 'tour_add2' }
    ],
    health: [
      { sel: '#quick-health-section .photo-label', watch: { sel: '#quick-health-input', ev: 'change' },
        hint: 'btn', key: 'tour_health1' }
    ],
    search: [
      { sel: '#web-search-input', info: true, key: 'tour_search1' }
    ],
    list: [
      { sel: '#search-input',  info: true, key: 'tour_list1' },
      { sel: '#source-filter', info: true, key: 'tour_list2' }
    ],
    account: [
      { sel: '#account-notify-watering', info: true, key: 'tour_account1' },
      { sel: '#account-save-btn',
        hint: 'btn', key: 'tour_account2' }
    ],
    admin: [
      { sel: '#admin-lock-toggle',
        hint: 'btn', key: 'tour_admin1' }
    ]
  };

  // איזה סיור שייך לאיזה מסך (null = אין סיור למסך הזה)
  const SECTION_TOUR_KEYS = {
    'add-plant-section': 'add',
    'quick-health-section': 'health',
    'web-search-section': 'search',
    'plants-list-section': 'list',
    'account-settings-section': 'account',
    'admin-section': 'admin',
    'guide-section': null
  };

  const coachLayer = document.getElementById('coach-layer');
  const coachRing = document.getElementById('coach-ring');
  const coachFinger = document.getElementById('coach-finger');
  const coachBubble = document.getElementById('coach-bubble');
  const coachTextEl = document.getElementById('coach-text');
  const coachCountEl = document.getElementById('coach-count');
  const coachNextBtn = document.getElementById('coach-next');
  const coachHintEl = document.getElementById('coach-hint');
  const coachSkipBtn = document.getElementById('coach-skip');

  let coachSteps = null;
  let coachIdx = 0;
  let coachRaf = 0;
  let coachDetach = null;
  // מזהה שרץ קדימה בכל התחלה/סיום של סיור. כל מאזין זוכר את הערך שבו נוצר,
  // כדי שלחיצה שמעבירה מסך לא תקדם בטעות את הסיור החדש שהתחיל בעקבותיה.
  let coachToken = 0;

  function tourStoreKey() {
    return 'avigrow_tour_v1_' + (currentUserId || 'anon');
  }
  function tourState() {
    try { return JSON.parse(localStorage.getItem(tourStoreKey()) || '{}'); } catch (e) { return {}; }
  }
  function markTourSeen(key) {
    try {
      const s = tourState();
      s[key] = true;
      localStorage.setItem(tourStoreKey(), JSON.stringify(s));
    } catch (e) { /* אחסון חסום - הסיור פשוט יופיע שוב */ }
  }

  // דגל גלובלי: מרגע שמישהו לוחץ "דילוג על הסיור" פעם אחת, מפסיקים לכפות
  // סיורים אוטומטיים בכל מסך אחר שהוא עוד לא ראה - לא רק במסך הנוכחי.
  // חוזרים להציע סיורים רק דרך הכפתור הידני במסך המדריך (replay-tour-btn).
  function tourDismissKey() {
    return 'avigrow_tour_dismissed_v1_' + (currentUserId || 'anon');
  }
  function isTourDismissed() {
    try { return localStorage.getItem(tourDismissKey()) === '1'; } catch (e) { return false; }
  }
  function markTourDismissed() {
    try { localStorage.setItem(tourDismissKey(), '1'); } catch (e) { /* אחסון חסום */ }
  }
  function clearTourDismissed() {
    try { localStorage.removeItem(tourDismissKey()); } catch (e) { /* אחסון חסום */ }
  }

  // אותו כפתור משמש גם לדילוג באמצע הסיור וגם ל"סגירה" אחרי שהמשתמש סיים
  // אותו עד הסוף - רק דילוג אמיתי (לפני הצעד האחרון) נחשב "ביטול" שמפסיק
  // לכפות סיורים אוטומטית במסכים אחרים; סגירה אחרי סיום לא.
  function skipTour() {
    if (coachSteps && coachIdx < coachSteps.length - 1) markTourDismissed();
    endTour();
  }

  function detachCoachWatcher() {
    if (coachDetach) { coachDetach(); coachDetach = null; }
  }

  function endTour() {
    coachToken++;
    detachCoachWatcher();
    if (coachRaf) { cancelAnimationFrame(coachRaf); coachRaf = 0; }
    coachSteps = null;
    coachLayer.classList.remove('on');
  }

  // ממקם את הטבעת, האצבע והבועה סביב היעד. נקרא בכל פריים כדי להישאר צמוד גם בגלילה.
  function placeCoach(target) {
    const r = target.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const pad = 6;

    coachRing.style.top = (r.top - pad) + 'px';
    coachRing.style.left = (r.left - pad) + 'px';
    coachRing.style.width = (r.width + pad * 2) + 'px';
    coachRing.style.height = (r.height + pad * 2) + 'px';

    // מעדיפים להצביע מלמטה כלפי מעלה; אם אין מקום - הופכים את הכיוון
    const below = (vh - r.bottom) > 190;
    coachFinger.textContent = below ? '👆' : '👇';
    coachFinger.style.left = Math.min(Math.max(r.left + r.width / 2 - 18, 8), vw - 44) + 'px';
    coachFinger.style.top = below ? (r.bottom + 10) + 'px' : (r.top - 48) + 'px';

    const bw = coachBubble.offsetWidth || 280;
    const bh = coachBubble.offsetHeight || 130;
    const gap = 12;
    const clampX = (x) => Math.min(Math.max(x, 10), Math.max(10, vw - bw - 10));
    const clampY = (y) => Math.min(Math.max(y, 10), Math.max(10, vh - bh - 10));
    const hides = (x, y) => !(x + bw < r.left || x > r.right || y + bh < r.top || y > r.bottom);

    let bx = clampX(r.left + r.width / 2 - bw / 2);
    let by = clampY(below ? r.bottom + 58 : r.top - 58 - bh);

    // במסך נמוך הבועה עלולה לכסות דווקא את מה שהיא מסבירה עליו - אז מזיזים אותה לצד
    if (hides(bx, by)) {
      const sideY = clampY(r.top + r.height / 2 - bh / 2);
      if (vw - r.right - gap >= bw + 10) { bx = r.right + gap; by = sideY; }
      else if (r.left - gap >= bw + 10) { bx = r.left - gap - bw; by = sideY; }
      else { by = (r.top + r.height / 2 < vh / 2) ? clampY(vh - bh - 10) : 10; }
    }
    coachBubble.style.left = bx + 'px';
    coachBubble.style.top = by + 'px';
  }

  function coachTick() {
    if (!coachSteps) return;
    const target = document.querySelector(coachSteps[coachIdx].sel);
    // היעד נעלם (נסגר המסך / הוחלף תוכן) - מסיימים בשקט
    if (!target || !target.getClientRects().length) { endTour(); return; }
    placeCoach(target);
    coachRaf = requestAnimationFrame(coachTick);
  }

  function showCoachStep() {
    if (!coachSteps) return;
    const step = coachSteps[coachIdx];
    const target = document.querySelector(step.sel);
    if (!target) { endTour(); return; }

    target.scrollIntoView({ behavior: 'smooth', block: 'center' });

    coachCountEl.textContent = coachSteps.length > 1 ? t('t_step', { i: coachIdx + 1, n: coachSteps.length }) : '';
    coachTextEl.textContent = t(step.key);

    const isLast = coachIdx === coachSteps.length - 1;
    if (step.info) {
      coachNextBtn.style.display = '';
      coachNextBtn.textContent = isLast ? t('t_done') : t('t_next');
      coachHintEl.textContent = '';
    } else {
      coachNextBtn.style.display = 'none';
      coachHintEl.textContent = step.info ? '' : (step.hint === 'btn' ? t('t_click_btn') : t('t_click'));
    }
    coachSkipBtn.textContent = isLast ? t('close') : t('t_skip');

    // מאזין שמקדם את הסיור ברגע שהמשתמש ביצע בפועל את הפעולה
    detachCoachWatcher();
    const watch = step.watch || { sel: step.sel, ev: 'click' };
    const watchEl = document.querySelector(watch.sel);
    if (watchEl) {
      const myToken = coachToken;
      const handler = () => {
        detachCoachWatcher();
        // השהיה קצרה כדי שהמסך יספיק להתעדכן לפני שהאצבע קופצת ליעד הבא
        setTimeout(() => { if (myToken === coachToken) advanceCoach(); }, 340);
      };
      watchEl.addEventListener(watch.ev, handler, { once: true });
      coachDetach = () => watchEl.removeEventListener(watch.ev, handler);
    }

    // מיקום ראשוני מיידי, כדי שהטבעת לא תהבהב לרגע בפינת המסך לפני הפריים הראשון
    placeCoach(target);
    if (coachRaf) cancelAnimationFrame(coachRaf);
    coachRaf = requestAnimationFrame(coachTick);
  }

  function advanceCoach() {
    if (!coachSteps) return;
    if (coachIdx >= coachSteps.length - 1) { endTour(); return; }
    coachIdx++;
    showCoachStep();
  }

  function startTour(key, force) {
    const steps = TOURS[key];
    if (!steps || !steps.length) return;
    if (!force && tourState()[key]) return;
    endTour();
    // מסמנים כ"נראה" כבר בהתחלה - הסיור מופיע פעם אחת, גם אם המשתמש עזב באמצע
    markTourSeen(key);
    coachSteps = steps;
    coachIdx = 0;
    coachLayer.classList.add('on');
    showCoachStep();
  }

  // מתזמן סיור אחרי שהמסך הספיק להיפתח ולהיגלל. אם בינתיים המסך נסגר - מוותרים.
  function scheduleTour(key, sectionEl, delay) {
    if (!key || tourState()[key] || isTourDismissed()) return;
    setTimeout(() => {
      if (sectionEl && sectionEl.style.display === 'none') return;
      startTour(key);
    }, delay || 520);
  }

  document.querySelectorAll('[data-lang-picker]').forEach(initLangPicker);
  applyLanguage(currentLang);

  coachNextBtn.addEventListener('click', advanceCoach);
  coachSkipBtn.addEventListener('click', skipTour);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') endTour(); });

  // ===== כפתורי הפעולה בעמוד הנחיתה =====
  const addSection = document.getElementById('add-plant-section');
  const quickHealthSection = document.getElementById('quick-health-section');
  const webSearchSection = document.getElementById('web-search-section');
  const accountSection = document.getElementById('account-settings-section');
  const guideSection = document.getElementById('guide-section');
  const adminSection = document.getElementById('admin-section');
  const plantsListSection = document.getElementById('plants-list-section');
  const allToggleSections = [addSection, quickHealthSection, webSearchSection, accountSection, guideSection, adminSection, plantsListSection];

  function showSection(section) {
    allToggleSections.forEach(s => { s.style.display = (s === section) ? 'block' : 'none'; });
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // מעבר מסך מסיים סיור פתוח, ומתחיל את הסיור של המסך החדש אם זו כניסה ראשונה
    endTour();
    scheduleTour(SECTION_TOUR_KEYS[section.id], section);
  }

  // כפתור "בית" - סוגר כל מסך/סקשן פתוח וחוזר לדף הנחיתה הראשי
  document.getElementById('home-btn').addEventListener('click', () => {
    endTour();
    allToggleSections.forEach(s => { s.style.display = 'none'; });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // הפעלת הסיור מחדש מתוך מסך המדריך

  // ===== חיפוש וסינון =====
  // חיפוש הדרגתי - כל תו שמוקלד מצמצם את הרשימה מיידית לפי תחילת השם
  // (עברית או אנגלית), כדי שההקלדה תרגיש כמו הדפדוף באינדקס הישן.
  let searchQuery = '';
  let sourceFilter = 'all'; // 'all' | 'mine' | 'web'
  let wateringOnlyFilter = false; // true = מגיעים מכרטיס "להשקות היום" בדף הבית

  function setWateringOnlyFilter(active) {

    const btn = e.target.closest('.filter-btn');

    sourceFilter = btn.dataset.source;

  // צמח "צריך השקיה" = יש לו מרווח השקיה מוגדר, הוא לא "מהרשת", והסטטוס שלו due/overdue
  function isDueForWatering(p) {
    if (p.source === 'web' || !p.wateringIntervalDays) return false;
    const w = computeWateringStatus(p);
    return !!w && (w.cls === 'due' || w.cls === 'overdue');
  }

  function filterPlants(plants) {
    return plants.filter(p => {
      const nameHe = (p.nameHe || '').toLowerCase();
      const nameEn = (p.nameEn || '').toLowerCase();
      const matchesSearch = !searchQuery || nameHe.startsWith(searchQuery) || nameEn.startsWith(searchQuery);
      const matchesSource = sourceFilter === 'all' || (p.source || 'mine') === sourceFilter;
      const matchesWatering = !wateringOnlyFilter || isDueForWatering(p);
      return matchesSearch && matchesSource && matchesWatering;
    });
  }

  // ===== שכבת שמירת נתונים - מדברת ישירות מול טבלת plants ב-Supabase =====
  // כתובת הטבלה: SUPABASE_TABLE_URL (Supabase REST / PostgREST)
  let plantsCache = []; // עותק אחרון שנטען, כדי לא לבצע קריאת רשת בכל render

  async function loadPlants() {
    assertSupabaseConfigured();
    // מסננים במפורש לפי user_id הנוכחי - לא מסתמכים רק על RLS, כי למנהלת המערכת
    // יש (בכוונה) הרשאת RLS לראות את כל הצמחים של כל המשתמשים (לצורך פאנל הניהול),
    // וכשההרשאה הזאת קיימת היא חלה על כל שאילתה, כולל הרשימה הרגילה כאן.
    const { data: { user } } = await sbClient.auth.getUser();
    const userFilter = user ? '&user_id=eq.' + encodeURIComponent(user.id) : '';
    const response = await fetch(SUPABASE_TABLE_URL + '?select=*&order=added_at.desc' + userFilter, {
      headers: await getSupabaseHeaders()
    });
    if (!response.ok) throw new Error('שגיאת שרת בטעינת הצמחים (קוד ' + response.status + ')');
    const rows = await response.json();
    plantsCache = rows.map(rowToPlant);
    return plantsCache;
  }

  async function insertPlant(plant) {
    assertSupabaseConfigured();
    const response = await fetch(SUPABASE_TABLE_URL, {
      method: 'POST',
      headers: { ...(await getSupabaseHeaders()), 'Prefer': 'return=representation' },
      body: JSON.stringify(plantToInsertRow(plant))
    });
    if (!response.ok) throw new Error('השמירה נכשלה (קוד ' + response.status + ')');
    const rows = await response.json();
    return rows[0] ? rowToPlant(rows[0]) : null;
  }

    });

  async function updatePlantPhotoRow(id, photoBase64) {

    const response = await fetch(SUPABASE_TABLE_URL + '?id=eq.' + encodeURIComponent(id), {

  // הוספה או החלפה של תמונה לצמח קיים. התמונה עוברת דרך אותה הקטנה
  // שעוברות תמונות חדשות, כדי לא לנפח את העמודה בקובץ ישירות מהמצלמה.
  async function changePlantPhoto(plantId) {
    const inputEl = document.getElementById('photo-input-' + plantId);
    const statusEl = document.getElementById('photo-status-' + plantId);
    const file = inputEl && inputEl.files[0];
    if (!file) return;
    if (statusEl) { statusEl.textContent = t('photo_saving'); statusEl.classList.remove('error'); }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error('read failed'));
        reader.readAsDataURL(file);
      });
      await updatePlantPhotoRow(plantId, await compressImage(dataUrl));
      await renderPlants(); // הרינדור מחדש מציג את התמונה החדשה ומנקה את הסטטוס
    } catch (err) {
      console.error('Updating plant photo failed:', (err && err.message) || String(err));
      if (statusEl) {
        statusEl.textContent = t('photo_save_failed') + ((err && err.message) || String(err));
        statusEl.classList.add('error');
      }
      if (inputEl) inputEl.value = ''; // מאפשר לנסות שוב עם אותו קובץ
    }

  // ===== ניהול השקיה =====
  async function updateWateringRow(id, fields) {
    assertSupabaseConfigured();
    const response = await fetch(SUPABASE_TABLE_URL + '?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: await getSupabaseHeaders(),

  // מחשבת את מצב ההשקיה של צמח: כמה ימים נשארו / כמה איחור יש
  function computeWateringStatus(p) {
    if (!p.wateringIntervalDays) return null;
    if (!p.lastWateredAt) {
      return { text: t('w_never'), cls: 'due' };
    }
    const msPerDay = 24 * 60 * 60 * 1000;
    const daysSince = Math.floor((Date.now() - new Date(p.lastWateredAt).getTime()) / msPerDay);
    const daysLeft = p.wateringIntervalDays - daysSince;
    if (daysLeft > 0) {
      return { text: t('w_next', { n: daysLeft, unit: daysUnit(daysLeft) }), cls: 'ok' };
    }
    if (daysLeft === 0) {
      return { text: t('w_today'), cls: 'due' };
    }
    return { text: t('w_late', { n: -daysLeft, unit: daysUnit(-daysLeft) }), cls: 'overdue' };
  }

  async function saveWateringInterval(id) {
    const input = document.getElementById('watering-interval-' + id);
    const statusEl = document.getElementById('watering-save-status-' + id);
    const raw = input.value.trim();
    const days = raw === '' ? null : parseInt(raw, 10);
    if (raw !== '' && (!Number.isFinite(days) || days < 1)) {
      if (statusEl) statusEl.textContent = t('w_bad_number');
      return;
    }
    try {
      await updateWateringRow(id, { watering_interval_days: days });
      await renderPlants();
    } catch (err) {
      if (statusEl) statusEl.textContent = t('error') + ((err && err.message) || String(err));
    }
  }

  async function markWatered(id) {
    try {
      await updateWateringRow(id, { last_watered_at: new Date().toISOString() });
      await renderPlants();
    } catch (err) {
      showGlobalError((err && err.message) || String(err));
